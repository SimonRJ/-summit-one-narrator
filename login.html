<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111e">
  <link rel="stylesheet" href="boot-loader.css?v=cinematic-20261113">
  <script defer src="boot-loader.js?v=cinematic-20261113"></script>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Summit One Login</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="main.css?v=1">
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:20px}
    .auth-card{width:min(520px,100%);background:#0d1b2a;border:1px solid #27415d;border-radius:24px;padding:24px}
    .auth-card h1{margin:0 0 8px;font-size:2rem}
    .auth-card p{color:#a9bad0}
    .field{display:grid;gap:8px;margin:16px 0}
    .field input{font-size:1.05rem;padding:14px 16px;border-radius:14px;border:1px solid #38536e;background:#07111e;color:#fff}
    .auth-actions{display:grid;gap:12px;margin-top:20px}
    .msg{min-height:24px;margin-top:12px;color:#a9bad0}
    .small-link{background:none;border:0;color:#8bdaf0;padding:0;font-size:.95rem}
  </style>

  <!-- Summit One editorial identity and genuine TeX mathematics -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.css">
  <link rel="stylesheet" href="design-system.css?v=identity-math-20261113">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.js"></script>
  <script type="module" src="math-typography.js?v=identity-math-20261113"></script>
</head>
<body>
  <div id="summitBoot" class="summit-boot" data-mode="main" role="status" aria-label="Summit One loading" aria-live="polite"><span class="sb-first-frame" aria-hidden="true"><img src="summit-mark.svg" alt="" width="104" height="104"></span></div>
  <main class="auth-card">
    <div class="summit-auth-identity"><img src="summit-mark.svg" alt="" width="60" height="60"><div><div class="summit-wordmark">SUMMIT <span class="summit-wordmark-one">ONE</span></div><small>MATHEMATICS TRAINING</small></div></div>
    <h1>Welcome back</h1>
    <p id="subtitle">Sign in to continue your maths training.</p>

    <div class="field">
      <label for="loginName">Login name</label>
      <input id="loginName" autocomplete="username" autocapitalize="none" spellcheck="false">
    </div>

    <div class="field">
      <label for="password">PIN / password</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>

    <div class="auth-actions">
      <button id="signIn">Sign in</button>
      <button id="createAccount" class="secondary" hidden>Create learner account</button>
    </div>

    <div id="message" class="msg"></div>
  </main>

  <script type="module" src="login.js?v=cinematic-practice-20261113"></script>
</body>
</html>
