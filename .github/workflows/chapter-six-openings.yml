name: Embed the six opening films’ chapter marks
on:
  push:
    branches: [production/six-chaptered-openings]
    paths: ['tools/video/embed_opening_chapters.py', '.github/workflows/chapter-six-openings.yml']
permissions:
  contents: write
jobs:
  chapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /media/S00[1-6]-Intro.mp4
            /review/S00[1-6]-Intro-qa.json
            /watch-intro-s00*.html
            /tools/video/embed_opening_chapters.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          python tools/video/embed_opening_chapters.py
      - name: Save the checked masters to this production branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'media/S00[1-6]-Intro.mp4' 'review/S00[1-6]-Intro-qa.json'
          if ! git diff --cached --quiet; then
            git commit -m "Embed verified chapter navigation in the first six lesson masters"
            git push origin HEAD:production/six-chaptered-openings
          fi
