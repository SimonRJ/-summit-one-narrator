name: Summit One lesson introduction series
run-name: Summit One lesson introductions

on:
  push:
    branches: [codex/lesson-intro-series]
    paths:
      - 'production/lesson-intros/course/queue.json'
  workflow_dispatch:
    inputs:
      retry:
        description: Retry number for a film that needs another recording
        type: choice
        options: ['0', '1', '2']
        default: '0'
      recordings_from:
        description: Previous run with any reusable recordings
        type: string
        required: false

concurrency:
  group: summit-one-lesson-intro-series
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      ids: ${{ steps.select.outputs.ids }}
      pilot: ${{ steps.select.outputs.pilot }}
      needed: ${{ steps.select.outputs.needed }}
      needed_count: ${{ steps.select.outputs.needed_count }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select the next authored lessons in course order
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          directory = Path("production/lesson-intros/course")
          sys.path.insert(0, str(directory))
          from release_intro import create_release, missing_candidates, select
          data = json.loads((directory / "queue.json").read_text())
          pilot = data.get("pilot_render", 0)
          assert type(pilot) is int and pilot >= 0
          limit = data.get("parallel", 18)
          assert type(limit) is int and 1 <= limit <= 18
          ids = ["S008"] if pilot else select(limit)
          if ids:
              create_release()
          needed = missing_candidates(ids) if ids and not pilot else []
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print("needed=" + json.dumps(needed, separators=(",",":")), file=out)
              print("needed_count=" + str(len(needed)), file=out)
              print("ids=" + json.dumps(ids, separators=(",",":")), file=out)
              print("count=" + str(len(ids)), file=out)
              print("pilot=" + str(pilot), file=out)
          print("Lessons selected for production:", ", ".join(ids))
          PY

  pilot:
    needs: select
    if: needs.select.outputs.pilot != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for the first independently rendered film
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_ID: ${{ needs.select.outputs.pilot }}
        run: gh run watch "$RENDER_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 20
      - uses: actions/download-artifact@v4
        with:
          name: S008
          path: build/t01-studio/S008
          run-id: ${{ needs.select.outputs.pilot }}
          github-token: ${{ github.token }}
      - name: Upload the verified narration and animation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python production/lesson-intros/course/release_intro.py stage S008

  produce:
    needs: select
    if: needs.select.outputs.needed_count != '0' && needs.select.outputs.pilot == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 280
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        lesson: ${{ fromJSON(needs.select.outputs.needed) }}
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Identify identical reusable teaching passages
        id: voice
        env:
          LESSON: ${{ matrix.lesson }}
        run: |
          key=$(python production/lesson-intros/course/produce_lesson.py "$LESSON" --cache-key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Reuse verified Voice C audio for identical passages
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: build/t01-studio/shared-voice
          key: summit-intro-voice-c-${{ steps.voice.outputs.key }}
      - name: Recover complete scenes from the previous attempt
        if: inputs.recordings_from != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: build/t01-studio
          name: recordings-${{ matrix.lesson }}
          run-id: ${{ inputs.recordings_from }}
          github-token: ${{ github.token }}
      - name: Install the pinned Voice C and video runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1 fonts-open-sans fonts-dejavu-core
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.45,<5' 'huggingface-hub<1' einops pydantic soundfile librosa safetensors tqdm numpy scipy inflect addict argbind pillow num2words faster-whisper
          pip install --no-deps 'git+https://github.com/OpenBMB/VoxCPM.git@300e4260b509066151d623dc9c0aa922cf82232b'
      - name: Record, align and render the lesson introduction
        env:
          LESSON: ${{ matrix.lesson }}
          RETRY: ${{ inputs.retry || '0' }}
        run: python production/lesson-intros/course/produce_lesson.py "$LESSON" --attempt "$RETRY"
      - name: Upload this checked movie
        env:
          GH_TOKEN: ${{ github.token }}
          LESSON: ${{ matrix.lesson }}
        run: python production/lesson-intros/course/release_intro.py stage "$LESSON"
      - name: Save diagnostics if a film needs another take
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.lesson }}
          path: |
            build/t01-studio/${{ matrix.lesson }}/alignment-failure.json
            build/t01-studio/${{ matrix.lesson }}/storyboard/*.jpg
          if-no-files-found: ignore
          retention-days: 3
      - name: Retain complete scenes for a retry
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: recordings-${{ matrix.lesson }}
          path: |
            build/t01-studio/${{ matrix.lesson }}-*.wav
            build/t01-studio/${{ matrix.lesson }}-*.json
          compression-level: 1
          if-no-files-found: ignore
          retention-days: 1

  verify:
    needs: select
    if: needs.select.outputs.count != '0'
    concurrency:
      group: summit-one-lesson-intro-player-check
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the playback test browser
        run: |
          npm install --no-save playwright
      - name: Put each film on the site and confirm playback
        env:
          GH_TOKEN: ${{ github.token }}
          LESSONS: ${{ needs.select.outputs.ids }}
          PILOT_ID: ${{ needs.select.outputs.pilot }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          ids = json.loads(os.environ["LESSONS"])
          wait = "90" if os.environ["PILOT_ID"] != "0" else "295"
          subprocess.run(["python", "production/lesson-intros/course/release_intro.py",
                          "publish", *ids, "--wait-minutes", wait], check=True)
          PY

  continue:
    needs: [select, produce, verify]
    if: always() && !cancelled() && needs.select.result == 'success' && needs.select.outputs.pilot == '0' && needs.select.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Continue with the next introductions
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.verify.result }}
          RETRY: ${{ inputs.retry || '0' }}
        run: |
          next_retry=0
          resume=()
          if [[ "$RESULT" != success ]]; then
            if [[ "$RETRY" -ge 2 ]]; then
              echo "::error::A lesson still needs a new take after two automatic retries."
              exit 1
            fi
            next_retry=$((RETRY + 1))
            resume=(-f "recordings_from=$GITHUB_RUN_ID")
          fi
          gh workflow run summit-intro-series.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" -f "retry=$next_retry" "${resume[@]}"
