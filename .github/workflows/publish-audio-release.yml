name: Publish recovered narration release
# publish-heygen-v1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-audio-release.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download recovered HeyGen shards
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 42918489302
          pattern: summit-one-heygen-89-*
          merge-multiple: true
          path: audio

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view summit-one-audio-v1 >/dev/null 2>&1 || \
            gh release create summit-one-audio-v1 --title "Summit One narration v1" --notes "Narration media for Summit One. Generated/recovered for the private training application."

      - name: Upload recovered WAVs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find audio -maxdepth 1 -type f -name '*_narration.wav' -print0 | \
            xargs -0 -n 20 gh release upload summit-one-audio-v1 --clobber
          echo "Published $(find audio -maxdepth 1 -type f -name '*_narration.wav' | wc -l) narration WAVs."
