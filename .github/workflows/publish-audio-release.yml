name: Publish recovered narration release
# publish-heygen-v2

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-audio-release.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download recovered HeyGen shards
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 42918489302
          pattern: summit-one-heygen-89-*
          merge-multiple: true
          path: audio

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view summit-one-audio-v1 --repo "${{ github.repository }}" >/dev/null 2>&1 ||             gh release create summit-one-audio-v1 --repo "${{ github.repository }}" --title "Summit One narration v1" --notes "Narration media for Summit One."

      - name: Upload recovered WAVs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=0
          while IFS= read -r -d '' file; do
            gh release upload summit-one-audio-v1 "$file" --repo "${{ github.repository }}" --clobber
            count=$((count+1))
          done < <(find audio -maxdepth 1 -type f -name '*_narration.wav' -print0)
          echo "Published $count narration WAVs."
          test "$count" -eq 89
