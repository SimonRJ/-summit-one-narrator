name: Make room to publish Summit One teaching films
on:
  push:
    branches: [codex/teaching-production]
    paths: ['.github/workflows/summit-defer-future-recordings.yml']
permissions:
  actions: write
jobs:
  defer:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Defer only voice batches whose recordings have yet to start
        run: |
          set -euo pipefail
          for run in 43693811168 43694066037 43694250472 43694446785 43694451556; do
            read -r branch workflow status < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '[.head_branch,.path,.status] | @tsv')
            if [[ "$branch" != codex/teaching-production || "$workflow" != .github/workflows/summit-teaching-narration.yml || "$status" == completed ]]; then
              continue
            fi
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100")
            if jq -e 'all(.jobs[]; .name == "plan" or .status == "queued")' <<< "$jobs" >/dev/null; then
              gh run cancel "$run" --repo "$GITHUB_REPOSITORY"
              echo "Deferred unopened recording batch $run"
            fi
          done
