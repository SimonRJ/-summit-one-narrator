name: Record the four reviewed course-welcome passages
on:
  push:
    branches: [production/standalone-welcome-pyramid-20261125]
    paths: ['production/standalone-review/welcome-script.json', '.github/workflows/standalone-welcome-voice.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reviewed-standalone-welcome-voice
  cancel-in-progress: false
jobs:
  voice:
    strategy:
      fail-fast: false
      matrix:
        segment: [13, 14, 15, 16]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            production
            data
            media/voice-audition
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the established narrator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.45,<5' 'huggingface-hub<1' einops pydantic soundfile librosa safetensors tqdm numpy scipy inflect addict argbind
          pip install --no-deps 'git+https://github.com/OpenBMB/VoxCPM.git@300e4260b509066151d623dc9c0aa922cf82232b'
      - name: Record a scene with its approved voice
        run: |
          cp production/standalone-review/welcome-script.json production/amc-introduction/narration.json
          python production/amc-introduction/synth.py --segment ${{ matrix.segment }}
      - uses: actions/upload-artifact@v4
        with:
          name: welcome-reviewed-${{ matrix.segment }}
          path: build/amc-introduction/speech-*.wav
          if-no-files-found: error
          retention-days: 14
