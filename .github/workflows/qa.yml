name: Summit One release gates
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: JavaScript syntax
        run: |
          for f in *.js scripts/*.mjs; do node --check "$f"; done
      - name: Canonical data and security gates
        run: node scripts/qa.mjs
      - name: Static file presence
        run: |
          test -f index.html
          test -f login.html
          test -f session.html
          test -f exams.html
          test -f exam.html
          test -f profile.html
          test -f review.html
