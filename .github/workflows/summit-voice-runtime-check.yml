name: Compare Voice C CPU thread counts
on:
  push:
    branches: [codex/lesson-intro-runtime-check]
    paths: ['.github/workflows/summit-voice-runtime-check.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2]
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pinned narration runtime
        run: |
          sudo apt-get install -y ffmpeg libsndfile1
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.45,<5' 'huggingface-hub<1' einops pydantic soundfile librosa safetensors tqdm numpy scipy inflect addict argbind num2words faster-whisper
          pip install --no-deps 'git+https://github.com/OpenBMB/VoxCPM.git@300e4260b509066151d623dc9c0aa922cf82232b'
      - name: Compare two CPU thread counts using the identical approved recording
        run: |
          mkdir -p build/runtime-check
          PYTHONPATH=production/t01-studio python - <<'PY'
          from pathlib import Path
          import subprocess
          from synth import RATE, REFERENCE, VOICE_SHA
          import hashlib
          assert hashlib.sha256(REFERENCE.read_bytes()).hexdigest() == VOICE_SHA
          wav=Path('build/runtime-check/reference.wav')
          subprocess.run(['ffmpeg','-v','error','-y','-i',str(REFERENCE),'-ar',str(RATE),'-ac','1',str(wav)],check=True)
          PY
          cat > "$RUNNER_TEMP/compare.py" <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          import sys
          from time import monotonic
          import numpy as np
          import soundfile as sf
          import torch
          from huggingface_hub import snapshot_download
          from voxcpm import VoxCPM
          from synth import MODEL_REVISION, RATE, ROOT

          torch.set_num_threads(4)
          torch.set_num_interop_threads(1)
          path=snapshot_download("openbmb/VoxCPM2", revision=MODEL_REVISION,
                      allow_patterns=["*.json","*.safetensors","audiovae.pth","*.model","*.txt"])
          model=VoxCPM.from_pretrained(path, load_denoiser=False, optimize=False, device="cpu")
          wav=str(Path("build/runtime-check/reference.wav"))
          text=json.loads((ROOT/"production/voice-audition/brief.json").read_text())["text"]
          story="One pump fills a tank in four minutes and another takes six minutes."
          options=dict(seed=445,cfg_value=2.0,inference_timesteps=10,max_len=375,
                       retry_badcase=True,retry_badcase_max_times=1)
          cached=model.tts_model.build_prompt_cache(prompt_text=text,prompt_wav_path=wav,reference_wav_path=wav)
          recordings = {}
          for threads in (4, 2):
              torch.set_num_threads(threads)
              start=monotonic()
              audio, _, _=model.tts_model.generate_with_prompt_cache(target_text=story,prompt_cache=cached,**options)
              recordings[threads] = audio.squeeze(0).cpu().numpy()
              print(f"{threads} threads: {monotonic()-start:.2f}s for {len(recordings[threads])/RATE:.2f}s of narration", flush=True)
          print("Identical narration samples:", np.array_equal(recordings[4], recordings[2]), flush=True)
          PY
          lscpu | sed -n '/Model name:/p'
          PYTHONPATH=production/t01-studio python "$RUNNER_TEMP/compare.py"
