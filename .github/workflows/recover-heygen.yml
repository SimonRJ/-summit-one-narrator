name: Recover 89 HeyGen narration tracks
# recovery-run-v3-sharded

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/recover-heygen.yml"

permissions:
  contents: read

jobs:
  recover:
    name: Recover shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download existing narration
        run: node scripts/recover-heygen-audio.mjs heygen-89-audio-manifest.json "heygen-audio-${{ matrix.shard }}" "${{ matrix.shard }}" 3
      - name: Upload recovered narration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summit-one-heygen-89-${{ matrix.shard }}
          path: heygen-audio-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
