name: Check the current published introduction on phones
on:
  push:
    branches: [codex/reviewed-film-work-20261119]
    paths: ['production/lesson-intros/phone-review-target.json']
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENGINE: chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - run: node tools/check-current-intro.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-intro-chrome
          path: build/phone
          if-no-files-found: warn
  webkit:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    timeout-minutes: 10
    env:
      ENGINE: webkit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - run: node tools/check-current-intro.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-intro-webkit
          path: build/phone
          if-no-files-found: warn
