name: Voice C completed-video pilot
on:
  push:
    branches: [main]
    paths: ['production/voice-c-pilot/**', '.github/workflows/voice-c-pilot.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voice-c-pilot
  cancel-in-progress: false
jobs:
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        segment: [0, 1, 2, 3, 4, 5]
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install speech runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.45,<5' 'huggingface-hub<1' einops pydantic soundfile librosa safetensors tqdm numpy scipy inflect addict argbind
          pip install --no-deps 'git+https://github.com/OpenBMB/VoxCPM.git@300e4260b509066151d623dc9c0aa922cf82232b'
      - name: Narrate using approved voice C reference
        run: python production/voice-c-pilot/synth.py --segment ${{ matrix.segment }}
      - uses: actions/upload-artifact@v4
        with:
          name: voice-c-segment-${{ matrix.segment }}
          path: build/amc2025-q17/speech-*.wav
          retention-days: 14
  render:
    needs: speech
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: voice-c-segment-*
          merge-multiple: true
          path: build/amc2025-q17
      - name: Install rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow numpy soundfile faster-whisper
      - name: Assemble and align new narration
        run: |
          python production/voice-c-pilot/synth.py
          python production/amc2025-q17/align.py --audio build/amc2025-q17/narration.wav --timing build/amc2025-q17/timing.json --out build/amc2025-q17
      - name: Render existing animation to the new spoken cues
        run: |
          python production/amc2025-q17/render.py
          ffmpeg -v error -y -i build/amc2025-q17/visual.mp4 -i build/amc2025-q17/narration.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -af apad -shortest -movflags +faststart build/amc2025-q17/final.mp4
          python production/amc2025-q17/verify.py
          python production/voice-c-pilot/verify.py
      - name: Publish verified video assets
        run: |
          cp build/amc2025-q17/final.mp4 media/AMC2025Q17-voice-c.mp4
          cp build/amc2025-q17/AMC2025Q17.vtt media/AMC2025Q17-voice-c.vtt
          cp build/amc2025-q17/poster.jpg media/AMC2025Q17-voice-c-poster.jpg
          cp build/amc2025-q17/qa.json review/AMC2025Q17-voice-c.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/AMC2025Q17-voice-c* review/AMC2025Q17-voice-c.json
          git commit -m 'Render AMC question 17 with approved voice C only'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-c-video-review
          path: build/amc2025-q17/
          retention-days: 14
