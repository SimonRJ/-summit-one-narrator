name: Generate remaining 175 narration tracks
# isolated-kokoro-v2-no-ffmpeg

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate-remaining-audio.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        name: Build 175-video matrix
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from "node:fs";
          const include=[];
          for(let i=1;i<=10;i++){
            const q="queue-"+String(i).padStart(2,"0")+".json";
            const arr=JSON.parse(fs.readFileSync(q,"utf8"));
            for(const v of arr) include.push({queue:q,id:v.video_id});
          }
          if(include.length!==175) throw new Error("Expected 175, got "+include.length);
          console.log("matrix="+JSON.stringify({include}));
          NODE

  ensure-release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure narration release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view summit-one-audio-v1 --repo "${{ github.repository }}" >/dev/null 2>&1 ||             gh release create summit-one-audio-v1 --repo "${{ github.repository }}" --title "Summit One narration v1" --notes "Narration media for Summit One."

  narrate:
    needs: [prepare, ensure-release]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Kokoro
        run: |
          npm init -y
          npm install kokoro-js@1.2.1
      - name: Generate isolated narration
        run: node scripts/generate-video-isolated.mjs "${{ matrix.queue }}" "${{ matrix.id }}" out
      - name: Publish narration asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload summit-one-audio-v1 "out/${{ matrix.id }}_narration.wav" --repo "${{ github.repository }}" --clobber
