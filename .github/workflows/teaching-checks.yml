name: Teaching behavior checks
on:
  push:
    branches: [main, draft/teaching-audit-2026-11-11]
    paths: ['*.js', '*.html', '*.css', 'data/**', 'tools/browser_checks.py', 'tools/check_learning.mjs', '.github/workflows/teaching-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teaching:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tools/check_learning.mjs
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - name: Browser behavior and responsive layout
        run: |
          python -m http.server 8765 > /tmp/server.log 2>&1 &
          python tools/browser_checks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teaching-screenshots
          path: docs/*-*.png
