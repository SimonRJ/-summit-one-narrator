name: Teaching behavior checks
on:
  pull_request:
    branches: [main]
    paths: ['*.js', '*.html', '*.css', 'data/**', 'tools/browser_lesson_fixed.py', 'tools/check_learning.mjs', 'tools/content/**', 'tools/video/**', 'production/scripts/**', '.github/workflows/teaching-checks.yml']
  push:
    branches: [recognition-coverage-20261113, main, rebuild-exam-centres-20261112, draft/teaching-audit-2026-11-11]
    paths: ['*.js', '*.html', '*.css', 'data/**', 'tools/browser_checks.py', 'tools/browser_lesson_fixed.py', 'tools/check_learning.mjs', 'tools/content/**', 'tools/video/**', 'production/scripts/**', '.github/workflows/teaching-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teaching:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tools/check_learning.mjs
      - run: python tools/content/check_original_lessons.py
      - run: python tools/content/audit_all_lessons.py
      - run: python tools/content/check_curated_batch2.py
      - run: python tools/video/build_scripts.py --check
      - run: pip install playwright==1.58.0
      - run: google-chrome --version
      - name: Browser behavior and responsive layout
        run: |
          python -m http.server 8765 > /tmp/server.log 2>&1 &
          python tools/browser_lesson_fixed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teaching-screenshots
          path: docs/*-*.png
