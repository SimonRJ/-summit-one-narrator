name: Complete S019 with stable phrase captions
on:
  push:
    branches: [production/s019-caption-stability]
    paths:
      - .github/workflows/s019-caption-stability.yml
      - production/lesson-films/recaption_spoken_condition.py
      - production/lesson-films/repair_spoken_condition.py
      - production/lesson-films/render_recorded.py
      - tools/video/test_spoken_condition_recaption.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s019-caption-stability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recaption:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            production
            data
            tools/video
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve the exact published domino-condition recording
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/source
          tag=s019-domino-condition-20261125-3d94f6856b47
          gh api "repos/SimonRJ/-summit-one-narrator/releases/tags/$tag" > build/source-release.json
          python - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('build/source-release.json').read_text())
          assert release['id'] == 457503450 and not release['draft']
          assert release['tag_name'] == 's019-domino-condition-20261125-3d94f6856b47'
          assert release['target_commitish'] == '3d94f6856b475eb160c11bf7b6334ff13e9c61b6'
          PY
          gh release download "$tag" --repo SimonRJ/-summit-one-narrator --pattern 'S019*' --dir build/source
      - name: Redraw one caption layer and preserve the approved narration
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y ffmpeg fonts-open-sans fonts-dejavu-core libsndfile1
          python -m pip install 'numpy==2.2.6' 'pillow==11.3.0' num2words soundfile
          python tools/video/test_spoken_condition_recaption.py
          python tools/video/test_recorded_caption.py
          python production/lesson-films/recaption_spoken_condition.py build/source build/candidate --lesson S019
          mkdir -p build/evidence
          ffmpeg -nostdin -v error -i build/candidate/S019.mp4 -vf "select=eq(n\,1481)" -fps_mode vfr -frames:v 1 build/evidence/S019-caption-check.png
      - uses: actions/upload-artifact@v4
        with:
          name: S019-stable-captions-candidate
          path: build/candidate/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: S019-stable-captions-provenance
          path: |
            build/evidence/
            build/source-release.json
          if-no-files-found: error
          retention-days: 30

  playback:
    needs: recaption
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [iphone-portrait, iphone-landscape, ipad-portrait, ipad-landscape, pc]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            data
            tools
            figures
            fonts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: S019-stable-captions-candidate
          path: build/candidate
      - run: python -m pip install 'playwright==1.58.0' aiohttp
      - if: matrix.profile != 'pc'
        run: python -m playwright install --with-deps webkit
      - name: Point isolated fixtures at the new candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          guide = json.loads(Path('build/candidate/S019-guide.json').read_text())
          guide['release'] = 'http://127.0.0.1:8765/build/candidate/'
          catalog = Path('data/recorded-studies.json')
          data = json.loads(catalog.read_text())
          data['lessons']['S019'] = guide
          catalog.write_text(json.dumps(data))
          found = []
          for name in ('read-watch-practise.json', 'read-watch-practise-later.json'):
              source = Path('data') / name
              data = json.loads(source.read_text())
              for row in data['lessons']:
                  if row.get('videoId') == 'S019':
                      found.append(row['slot'])
                      row.update(movie=guide['release'] + 'S019.mp4', videoTitle=guide['title'])
                      if row['slot'] == 19:
                          row.update(bridge=guide['bridge'], filmUse='dedicated')
                      else:
                          assert row['slot'] == 333
                          row.update(filmUse='technique', bridge='In the film, compare the two removed corner squares with the two neighbouring squares. Why does removing the same number of squares permit one tiling but rule out the other?')
              source.write_text(json.dumps(data))
          assert sorted(found) == [19, 333], found
          PY
      - name: Check gallery, active lessons and immutable notebooks
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/s019-server.log" 2>&1 &
          from aiohttp import web
          from pathlib import Path
          root = Path.cwd()
          app = web.Application()
          async def index(request):
              return web.FileResponse(root / 'index.html')
          app.router.add_get('/', index)
          app.router.add_static('/', root)
          web.run_app(app, host='127.0.0.1', port=8765)
          PY
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --silent --retry 15 --retry-connrefused http://127.0.0.1:8765/ -o /dev/null
          python tools/check_lesson_film_routes.py --lesson S019 --site http://127.0.0.1:8765/ --profile "$PROFILE" --output build/device/S019
          if [[ "$PROFILE" == pc || "$PROFILE" == ipad-portrait ]]; then
            python tools/check_lesson_film_routes.py --lesson S019 --consumer-slot 333 --site http://127.0.0.1:8765/ --profile "$PROFILE" --output build/device/slot333
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S019-stable-captions-${{ matrix.profile }}
          path: build/device/
          if-no-files-found: warn
          retention-days: 30

  release:
    needs: playback
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: S019-stable-captions-candidate
          path: verified
      - name: Publish a separate immutable edition and compare returned bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="s019-stable-captions-20261125-${GITHUB_SHA:0:12}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title 'The domino colour test — clear captions' --notes 'The approved leftmost-pair condition is unchanged. Scene 5 uses one stable caption layer; the original AAC bytes/timestamps, exact 4269 video frames, timeline, VTT and other 10 scenes are retained. Final deployed-route and audible/editorial acceptance remain separate.'
          fi
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
          if [[ "$draft" == true ]]; then gh release upload "$tag" verified/* --clobber; fi
          gh release download "$tag" --dir returned
          for asset in verified/*; do cmp "$asset" "returned/${asset##*/}"; done
          if [[ "$draft" == true ]]; then gh release edit "$tag" --draft=false --latest=false; fi
          mkdir public-returned
          for asset in verified/*; do
            name=${asset##*/}
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 90 "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name" -o "public-returned/$name"
            cmp "$asset" "public-returned/$name"
          done
          echo "Published and byte-checked $tag"
          cat verified/S019-guide.json
          cat verified/S019-qa.json
