name: Summit One lesson introduction release

on:
  push:
    branches: ['codex/lesson-intro-release', main]
    paths:
      - 'production/t01-studio/intro_release_plan.json'

permissions:
  actions: read
  contents: read

jobs:
  stage:
    if: github.ref_name == 'codex/lesson-intro-release'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read the approved render run
        id: plan
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads(Path("production/t01-studio/intro_release_plan.json").read_text())
          assert type(plan["render_run"]) is int and plan["render_run"] > 0
          assert plan["lessons"] == [f"S{slot:03}" for slot in range(1, 6)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"render={plan['render_run']}", file=out)
          PY
      - name: Wait until all five films pass render checks
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_RUN: ${{ steps.plan.outputs.render }}
        run: gh run watch "$RENDER_RUN" --repo "$GITHUB_REPOSITORY" --exit-status --interval 20
      - uses: actions/download-artifact@v4
        with:
          pattern: S00*
          path: build/t01-studio
          run-id: ${{ steps.plan.outputs.render }}
          github-token: ${{ github.token }}
      - name: Prepare films and review pages
        run: |
          python production/t01-studio/verify_intro_examples.py
          python production/t01-studio/publish_intro_batch.py
          node --input-type=module --check < app-main.js
          node --input-type=module --check < course-menu-ui.js
          node --input-type=module --check < lesson-introduction-media.js
          node --check lesson-introduction-watch.js
          node --check sw.js
      - name: Save the five finished films
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/S00*-Intro* review/S00*-Intro-qa.json watch-intro-s00*.html lesson-introduction-videos.html
          git diff --cached --check
          git commit -m 'Publish Summit One introduction videos for lessons 1–5'
          git push origin "HEAD:$GITHUB_REF_NAME"

  verify:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify all five live introductions
        run: python production/t01-studio/check_published_intros.py https://simonrj.github.io/-summit-one-narrator/
