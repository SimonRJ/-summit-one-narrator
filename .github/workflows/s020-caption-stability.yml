name: Complete S020 with stable phrase captions
on:
  push:
    branches: [main, production/s020-caption-stability]
    paths:
      - .github/workflows/s020-caption-stability.yml
      - production/lesson-films/recaption_spoken_condition.py
      - production/lesson-films/repair_spoken_condition.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: s020-caption-stability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recaption:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the immutable recorded candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_run="repos/$GITHUB_REPOSITORY/actions/runs/45491820136"
          test "$(gh api "$source_run" --jq .head_sha)" = '3d94f6856b475eb160c11bf7b6334ff13e9c61b6'
          test "$(gh api "$source_run" --jq .path)" = '.github/workflows/s020-exponent-49.yml'
          artifact="repos/$GITHUB_REPOSITORY/actions/artifacts/14969252264"
          test "$(gh api "$artifact" --jq .name)" = 'S020-reviewed-candidate'
          test "$(gh api "$artifact" --jq .digest)" = 'sha256:16abdc1a939859424b2f7be5db960b430f46b25fa82b90a0e65f0a742ff73784'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45491820136
          artifact-ids: 14969252264
          merge-multiple: true
          path: build/source
      - name: Redraw one caption layer and preserve the approved narration
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y ffmpeg fonts-open-sans fonts-dejavu-core libsndfile1
          python -m pip install 'numpy==2.2.6' 'pillow==11.3.0' num2words soundfile
          python production/lesson-films/recaption_spoken_condition.py build/source build/candidate
          ffmpeg -nostdin -v error -y -ss 145.5 -i build/candidate/S020.mp4 -frames:v 1 build/candidate/S020-caption-check.png
      - uses: actions/upload-artifact@v4
        with:
          name: S020-stable-captions-candidate
          path: build/candidate/
          if-no-files-found: error
          retention-days: 30

  playback:
    needs: recaption
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [iphone-portrait, iphone-landscape, ipad-portrait, ipad-landscape, pc]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: S020-stable-captions-candidate
          path: build/candidate
      - run: python -m pip install 'playwright==1.58.0' aiohttp
      - if: matrix.profile != 'pc'
        run: python -m playwright install --with-deps webkit
      - name: Point isolated fixtures at the new candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          guide = json.loads(Path('build/candidate/S020-guide.json').read_text())
          guide['release'] = 'http://127.0.0.1:8765/build/candidate/'
          catalog = Path('data/recorded-studies.json')
          data = json.loads(catalog.read_text())
          data['lessons']['S020'] = guide
          catalog.write_text(json.dumps(data))
          found = []
          for name in ('read-watch-practise.json', 'read-watch-practise-later.json'):
              source = Path('data') / name
              data = json.loads(source.read_text())
              for row in data['lessons']:
                  if row.get('videoId') == 'S020':
                      found.append(row['slot'])
                      row.update(movie=guide['release'] + 'S020.mp4', videoTitle=guide['title'])
                      if row['slot'] == 20:
                          row.update(bridge=guide['bridge'], filmUse='dedicated')
              source.write_text(json.dumps(data))
          assert sorted(found) == [20, 283], found
          PY
      - name: Check gallery, active lessons and immutable notebooks
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/s020-server.log" 2>&1 &
          from aiohttp import web
          from pathlib import Path
          root = Path.cwd()
          app = web.Application()
          async def index(request):
              return web.FileResponse(root / 'index.html')
          app.router.add_get('/', index)
          app.router.add_static('/', root)
          web.run_app(app, host='127.0.0.1', port=8765)
          PY
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --silent --retry 15 --retry-connrefused http://127.0.0.1:8765/ -o /dev/null
          python tools/check_lesson_film_routes.py --lesson S020 --site http://127.0.0.1:8765/ --profile "$PROFILE" --output build/device/S020
          if [[ "$PROFILE" == pc || "$PROFILE" == ipad-portrait ]]; then
            python tools/check_lesson_film_routes.py --lesson S020 --consumer-slot 283 --site http://127.0.0.1:8765/ --profile "$PROFILE" --output build/device/slot283
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: S020-stable-captions-${{ matrix.profile }}
          path: build/device/
          if-no-files-found: warn
          retention-days: 30

  release:
    needs: playback
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: S020-stable-captions-candidate
          path: verified
      - name: Publish a separate immutable edition and compare returned bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="s020-stable-captions-20261125-${GITHUB_SHA:0:12}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title 'Clock turns and last digits — clear captions' --notes 'Exponent 49 starts cycle position 1. The corrected scene uses one stable caption layer; approved Voice C audio packets and caption timing are preserved.'
          fi
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
          if [[ "$draft" == true ]]; then gh release upload "$tag" verified/* --clobber; fi
          gh release download "$tag" --dir returned
          for asset in verified/*; do cmp "$asset" "returned/${asset##*/}"; done
          if [[ "$draft" == true ]]; then gh release edit "$tag" --draft=false --latest=false; fi
          mkdir public-returned
          for asset in verified/*; do
            name=${asset##*/}
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 90 "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name" -o "public-returned/$name"
            cmp "$asset" "public-returned/$name"
          done
          echo "Published and byte-checked $tag"
          cat verified/S020-guide.json
          cat verified/S020-qa.json
