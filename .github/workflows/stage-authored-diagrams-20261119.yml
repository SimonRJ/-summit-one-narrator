name: Stage individual badge, boundary and folding-box animations
on:
  push:
    branches: [codex/reviewed-film-work-20261119]
    paths:
      - 'production/lesson-intros/illustrated/badge_arrangements.py'
      - 'production/lesson-intros/illustrated/boundary_walk.py'
      - 'production/lesson-intros/illustrated/folding_box.py'
      - '.github/workflows/stage-authored-diagrams-20261119.yml'
permissions:
  contents: read
jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      lessons: ${{ steps.select.outputs.lessons }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: select
        run: |
          python - <<'PY'
          import os,subprocess,json
          files=set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          modules={'badge_arrangements':'S023','boundary_walk':'S043','folding_box':'S090'}
          ids=[id for name,id in modules.items() if 'production/lesson-intros/illustrated/'+name+'.py' in files]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: print('lessons='+json.dumps(ids),file=f)
          PY
  render:
    needs: changed
    if: needs.changed.outputs.lessons != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.changed.outputs.lessons) }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      FILM: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install drawing and encoding tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow
      - name: Render and verify the original audio packets and caption track
        run: python production/lesson-intros/illustrated/render_captioned_lesson.py "$FILM" --out build/diagrams
      - name: Stage the film and poster for playback review
        run: |
          mkdir -p build/remote
          for asset in "$FILM-Intro-Illustrated.mp4" "$FILM-Intro-Illustrated-poster.jpg"; do
            if ! gh release download lesson-introductions -p "$asset" -D build/remote; then
              gh release upload lesson-introductions "build/diagrams/$asset"
              gh release download lesson-introductions -p "$asset" -D build/remote
            fi
            cmp "build/diagrams/$asset" "build/remote/$asset"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: public-video-digest-${{ matrix.id }}
          path: build/diagrams/*-qa.json
