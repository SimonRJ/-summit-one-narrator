name: Stage individually drawn lesson animations
on:
  push:
    branches: [codex/reviewed-film-work-20261119]
    paths:
      - 'production/lesson-intros/illustrated/*.py'
      - '.github/workflows/stage-authored-diagrams-20261119.yml'
permissions:
  contents: read
jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      lessons: ${{ steps.select.outputs.lessons }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: select
        run: |
          python - <<'PY'
          import os,subprocess,json
          files=set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          import ast,pathlib
          definitions=ast.parse(pathlib.Path('production/lesson-intros/illustrated/render_captioned_lesson.py').read_text())
          modules=next(ast.literal_eval(node.value) for node in definitions.body if isinstance(node,ast.Assign) and any(getattr(t,'id',None)=='MODULES' for t in node.targets))
          ids=[id for id,name in modules.items() if 'production/lesson-intros/illustrated/'+name+'.py' in files]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: print('lessons='+json.dumps(ids),file=f)
          PY
  render:
    needs: changed
    if: needs.changed.outputs.lessons != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.changed.outputs.lessons) }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      FILM: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install drawing and encoding tools
        run: python production/lesson-intros/illustrated/install_media_tools.py
      - name: Render and verify the original audio packets and caption track
        run: python production/lesson-intros/illustrated/render_captioned_lesson.py "$FILM" --out build/diagrams
      - name: Review the encoded illustrations, captions and narration against the timed artwork
        run: |
          pip install numpy
          art=production/lesson-intros/illustrated
          module=$(PYTHONPATH="$art" python -c "import os; from render_captioned_lesson import MODULES; print(MODULES[os.environ['FILM']])")
          movies=(build/diagrams/"$FILM"-Intro-Illustrated*.mp4)
          test "${#movies[@]}" -eq 1
          python "$art/check_encoded_timeline.py" "$module" "build/diagrams/$FILM-original.mp4" "${movies[0]}" --report "build/diagrams/$FILM-comparison.json"
      - name: Stage the film and poster for playback review
        run: |
          mkdir -p build/remote
          for media in build/diagrams/"$FILM"-Intro-Illustrated*.mp4 build/diagrams/"$FILM"-Intro-Illustrated*-poster.jpg; do
            asset=$(basename "$media")
            if ! gh release download lesson-introductions -p "$asset" -D build/remote; then
              gh release upload lesson-introductions "build/diagrams/$asset"
              gh release download lesson-introductions -p "$asset" -D build/remote
            fi
            cmp "build/diagrams/$asset" "build/remote/$asset"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: public-video-digest-${{ matrix.id }}
          path: |
            build/diagrams/*-qa.json
            build/diagrams/*-comparison.json
