name: Summit One Voice C short passage recording

on:
  push:
    branches: [codex/t01-voice-c-recovery]
    paths:
      - 'production/scripts/T01.1.json'
      - 'production/scripts/T01.2.json'
      - 'production/t01-studio/record_passages.py'
      - '.github/workflows/t01-voice-c-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t01-voice-c-${{ github.ref }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        lesson: ['T01.1', 'T01.2']
        scene: [2, 4, 8, 9]
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the pinned Voice C runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.45,<5' 'huggingface-hub<1' einops pydantic soundfile librosa safetensors tqdm numpy scipy inflect addict argbind
          pip install --no-deps 'git+https://github.com/OpenBMB/VoxCPM.git@300e4260b509066151d623dc9c0aa922cf82232b'
      - name: Record both lessons with the approved Voice C reference
        run: python production/t01-studio/record_passages.py --lesson "${{ matrix.lesson }}" --scene "${{ matrix.scene }}" --short-passages
      - uses: actions/upload-artifact@v4
        with:
          name: t01-rescue-${{ matrix.lesson }}-${{ matrix.scene }}
          path: |
            build/t01-studio/T01.*.wav
            build/t01-studio/T01.*.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
