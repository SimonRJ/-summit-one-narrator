name: Check the invariant, inverse, order and remainder lessons on phones
on:
  push:
    branches: [codex/reviewed-film-work-20261119]
    paths: ['.github/workflows/check-invariant-order-remainder.yml', 'tools/review-public-video-players.cjs']
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENGINE: chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - name: Wait for the checked remainder movie on Pages
        run: |
          for attempt in $(seq 1 35); do
            if curl -fsS "https://simonrj.github.io/-summit-one-narrator/watch-t03-1.html" | grep -q 'T03.1.mp4?v=bead-week-review'; then
              curl -fsS "https://simonrj.github.io/-summit-one-narrator/media/T03.1.mp4?v=bead-week-review" -o "$RUNNER_TEMP/remainder.mp4"
              echo "d5f41b3400ae38c694853dd8d91609ffa8ab502e3277dc589488bd56752749db  $RUNNER_TEMP/remainder.mp4" | sha256sum -c - && exit 0
            fi
            sleep 10
          done
          exit 1
      - run: node tools/review-public-video-players.cjs T02.1 T02.2 T02.E T03.1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariant-order-remainder-chrome
          path: build/phone
          if-no-files-found: warn
  webkit:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    timeout-minutes: 15
    env:
      ENGINE: webkit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - name: Wait for the checked remainder movie on Pages
        run: |
          for attempt in $(seq 1 35); do
            if curl -fsS "https://simonrj.github.io/-summit-one-narrator/watch-t03-1.html" | grep -q 'T03.1.mp4?v=bead-week-review'; then
              curl -fsS "https://simonrj.github.io/-summit-one-narrator/media/T03.1.mp4?v=bead-week-review" -o "$RUNNER_TEMP/remainder.mp4"
              echo "d5f41b3400ae38c694853dd8d91609ffa8ab502e3277dc589488bd56752749db  $RUNNER_TEMP/remainder.mp4" | sha256sum -c - && exit 0
            fi
            sleep 10
          done
          exit 1
      - run: node tools/review-public-video-players.cjs T02.1 T02.2 T02.E T03.1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariant-order-remainder-webkit
          path: build/phone
          if-no-files-found: warn
