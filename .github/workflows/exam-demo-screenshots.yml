name: AMC demonstration screenshots
on:
  push:
    branches: [screenshots/amc-2025-20261112]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0
      - name: Capture an isolated demonstration sitting
        run: |
          python -m http.server 8765 > /tmp/server.log 2>&1 &
          python tools/capture_exam_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: AMC-2025-demonstration-screenshots
          path: docs/AMC-2025-*.png
