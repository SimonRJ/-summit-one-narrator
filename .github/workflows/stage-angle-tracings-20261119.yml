name: Render the rigid angle tracing and triangle proof in T12.1
on:
  push:
    branches: [codex/reviewed-film-work-20261119]
    paths: ['production/lesson-intros/illustrated/drafting_angles.py','.github/workflows/stage-angle-tracings-20261119.yml']
permissions:
  contents: write
jobs:
  triangles:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the drawing and encoding tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow
      - name: Render the proof and verify every original audio packet
        env:
          PYTHONPATH: production/lesson-intros/illustrated
        run: |
          python - <<'PY'
          import json,pathlib,shutil
          import drafting_angles as spec
          from captioned_film import render
          root=pathlib.Path('.');out=root/'build/angle-tracings'
          qa=render(spec,root/'media/T12.1.mp4',out)
          shutil.copy(out/'T12.1-Intro-Illustrated.mp4',root/'media/T12.1.mp4')
          shutil.copy(out/'T12.1-Intro-Illustrated-poster.jpg',root/'media/T12.1-studio-poster.jpg')
          p=root/'review/T12.1-studio-qa.json';record=json.loads(p.read_text());assert record['sha256']==qa['legacy_sha256']
          record.update(source_sha256=record['sha256'],sha256=qa['sha256'],diagram_revision='The 65-degree tracing slides rigidly down the transversal and the marked base angles move onto a parallel through the apex. Both isosceles drawings match the stated angles.',original_audio_packets=qa['audio_packets']);p.write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Keep the rendered film and digest together for review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/T12.1.mp4 media/T12.1-studio-poster.jpg review/T12.1-studio-qa.json
          git commit -m 'Stage the drawing-set constructions against all eight recorded chapters'
          git push origin HEAD:refs/heads/codex/t121-rendered-media-20261119
