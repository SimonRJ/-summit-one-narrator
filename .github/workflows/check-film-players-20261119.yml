name: Check the published lessons in phone-sized players
on:
  push:
    branches: [codex/reviewed-film-work-20261119]
    paths: ['.github/workflows/check-film-players-20261119.yml']
permissions:
  contents: read
env:
  FILMS: S041 S044 S045 S046 S047 S050 S051 S052 S054 S055 S057 S058 S059 S060 S062 S065 S083 T03.2 T12.2 T12.3 T13.3
  ILLUSTRATED: S041 S044 S045 S046 S047 S050 S051 S052 S054 S055 S057 S058 S059 S060 S062 S065 S083
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      ENGINE: chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - run: node tools/review-public-video-players.cjs $FILMS
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-players-chrome
          path: build/phone
          if-no-files-found: warn
  webkit:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    timeout-minutes: 16
    env:
      ENGINE: webkit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - run: node tools/review-public-video-players.cjs $FILMS
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-players-webkit
          path: build/phone
          if-no-files-found: warn
