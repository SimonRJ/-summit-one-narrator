name: Render the number press and carriage bookings
on:
  push:
    branches: [production/counting-workshops]
    paths: ['.github/workflows/counting-workshops.yml', 'production/lesson-films/counting_workshops.py', 'production/lesson-films/release_counting_workshops.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /production/
            /review/T05.2-studio-qa.json
            /review/T05.3-studio-qa.json
            /media/T05.[23]*
            /watch-t05-2.html
            /watch-t05-3.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the video and type renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install Pillow
      - name: Draw both authored films and verify retained AAC streams
        run: |
          python production/lesson-films/counting_workshops.py T05.2 "$RUNNER_TEMP/films"
          python production/lesson-films/counting_workshops.py T05.3 "$RUNNER_TEMP/films"
          python production/lesson-films/release_counting_workshops.py "$RUNNER_TEMP/films"
      - name: Publish the verified candidates to their review branch
        run: |
          git config user.name github-actions
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/T05.[23].mp4 media/T05.[23]-studio-poster.jpg watch-t05-2.html watch-t05-3.html review/T05.[23]-studio-qa.json production/t01-studio/publish.py
          git commit -m 'Install the number press and carriage booking editions for editorial review'
          git push origin HEAD:refs/heads/release/counting-workshops-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: counting-workshop-candidates
          path: |
            review/T05.[23]-studio-qa.json
            media/T05.[23]-studio-poster.jpg
          retention-days: 30
