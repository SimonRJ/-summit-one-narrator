name: Render the same-base triangle proof and measured cutouts in T13.1
on:
  push:
    branches: [codex/reviewed-film-work-20261119]
    paths: ['production/lesson-intros/illustrated/triangle_area_studio.py','.github/workflows/stage-triangle-area-proof-20261119.yml']
permissions:
  contents: write
jobs:
  triangles:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the drawing and encoding tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow
      - name: Render the proof and verify every original audio packet
        env:
          PYTHONPATH: production/lesson-intros/illustrated
        run: |
          python - <<'PY'
          import json,pathlib,shutil
          import triangle_area_studio as spec
          from captioned_film import render
          root=pathlib.Path('.');out=root/'build/triangle-area'
          qa=render(spec,root/'media/T13.1.mp4',out)
          shutil.copy(out/'T13.1-Intro-Illustrated.mp4',root/'media/T13.1.mp4')
          shutil.copy(out/'T13.1-Intro-Illustrated-poster.jpg',root/'media/T13.1-studio-poster.jpg')
          p=root/'review/T13.1-studio-qa.json';record=json.loads(p.read_text());assert record['sha256']==qa['legacy_sha256']
          record.update(source_sha256=record['sha256'],sha256=qa['sha256'],diagram_revision='The moving apex keeps an exact 8 cm base and 5 cm height. A rigid half-turn, area-preserving shear, and 6-by-4 cutouts prove the area results.',original_audio_packets=qa['audio_packets']);p.write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Keep the rendered film and digest together for review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/T13.1.mp4 media/T13.1-studio-poster.jpg review/T13.1-studio-qa.json
          git commit -m 'Stage the measured moving triangle and all eight corrected chapters'
          git push origin HEAD:refs/heads/codex/t131-rendered-media-20261119
