name: Publish rebuilt lesson 6 introduction

on:
  push:
    branches: [codex/s006-visual-rebuild-20261116]
    paths: ['.github/workflows/publish-rebuilt-s006.yml']

permissions:
  contents: read

jobs:
  publish-lesson-6:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Check out reviewed animation source and original film
        uses: actions/checkout@v4
        with:
          path: authoring
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /production/lesson-intros/illustrated/**
            /media/S006-Intro.mp4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install Pillow
      - name: Check mathematics and render with the original audio
        working-directory: authoring
        run: |
          python production/lesson-intros/illustrated/check_s006.py
          python production/lesson-intros/illustrated/render.py S006 --out ../build/s006 --preview
          python production/lesson-intros/illustrated/render.py S006 --out ../build/s006 --source media/S006-Intro.mp4
      - name: Check out the current live site
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /media/S006-Intro.mp4
            /media/S006-Intro-poster.jpg
            /review/S006-Intro-qa.json
            /lesson-introduction-media.js
            /watch-intro-s006.html
            /sw.js
      - name: Stage only the reviewed lesson and invalidate its cache
        run: |
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path

          timeline=json.loads(Path("authoring/production/lesson-intros/illustrated/S006.json").read_text())
          live=Path("main-source")
          video=live/"media/S006-Intro.mp4"
          assert hashlib.sha256(video.read_bytes()).hexdigest()==timeline["legacy_sha256"], "Live lesson changed since review"
          output=Path("build/s006")
          replacement=output/"S006-Intro-Illustrated.mp4"
          report=json.loads((output/"S006-qa.json").read_text())
          assert hashlib.sha256(replacement.read_bytes()).hexdigest()==report["sha256"]
          shutil.copyfile(replacement,video)
          shutil.copyfile(output/"S006-Intro-Illustrated-poster.jpg",live/"media/S006-Intro-poster.jpg")
          qa_path=live/"review/S006-Intro-qa.json"
          qa=json.loads(qa_path.read_text())
          qa.update(sha256=report["sha256"],bytes=video.stat().st_size,duration_seconds=report["seconds"],
                    width=1920,height=1080,fps=30,audio_streams=1,
                    narration="Approved Voice C; original AAC packets copied unchanged",
                    caption_layers=1,mathematics_verified=True,
                    visual_review="Sampled motion and captions; full-length and phone review remain pending")
          qa_path.write_text(json.dumps(qa,ensure_ascii=False,indent=2)+"\n")
          media=live/"lesson-introduction-media.js"
          text=media.read_text()
          before='S005: "intro-20261116-illustrated"'
          assert before in text and 'S006:' not in text
          media.write_text(text.replace(before,before+', S006: "intro-20261116-illustrated"',1))
          watch=live/"watch-intro-s006.html"
          text=watch.read_text()
          assert text.count("media/S006-Intro.mp4?v=lesson-intros-v2")==2
          assert text.count("media/S006-Intro-poster.jpg?v=lesson-intros-v2")==1
          text=text.replace("media/S006-Intro.mp4?v=lesson-intros-v2","media/S006-Intro.mp4?v=intro-20261116-illustrated")
          text=text.replace("media/S006-Intro-poster.jpg?v=lesson-intros-v2","media/S006-Intro-poster.jpg?v=intro-20261116-illustrated")
          watch.write_text(text)
          sw=live/"sw.js"
          text=sw.read_text()
          assert 'summit-one-lesson-intros-v12' in text
          sw.write_text(text.replace('summit-one-lesson-intros-v12','summit-one-lesson-intros-v13',1))
          PY
      - name: Publish the replacement without changing other content
        working-directory: main-source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/S006-Intro.mp4 media/S006-Intro-poster.jpg review/S006-Intro-qa.json lesson-introduction-media.js watch-intro-s006.html sw.js
          git commit -m 'Rebuild lesson 6 introductory animation'
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)" || { echo 'Main changed; stop and review before retrying.'; exit 1; }
          git push origin HEAD:main
      - name: Preserve the finished film and visual review sheet
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-s006-film
          path: |
            build/s006/S006-Intro-Illustrated.mp4
            build/s006/S006-Intro-Illustrated-poster.jpg
            build/s006/S006-contact.jpg
            build/s006/S006-qa.json
          retention-days: 30
