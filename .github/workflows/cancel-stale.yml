name: Cancel stale narration runs
on:
  push:
    paths:
      - ".github/workflows/cancel-stale.yml"
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 42923557177 42925061213; do
            gh run cancel "$id" --repo "${{ github.repository }}" || true
          done
