name: Publish and verify completed Summit One introductions
run-name: Start the continuing Summit One playback checks
on:
  push:
    branches: [codex/lesson-intro-runtime-check]
    paths: ['.github/workflows/summit-intro-fastlane.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: summit-intro-ready-film-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: '78ea9e814d2d1feb1e5609487d2cba68dbe90849'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install playback verification
        run: npm install --no-save playwright
      - name: Publish already-rendered films only after public playback verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python production/lesson-intros/course/release_intro.py publish S139 --wait-minutes 10
      - name: Start the continuing playback checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run summit-intro-series.yml --repo "$GITHUB_REPOSITORY" \
            --ref codex/lesson-intro-series -f producer_run=43823192284
