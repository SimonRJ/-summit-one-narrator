name: Publish and verify completed Summit One introductions
run-name: Verify the next finished lesson introductions
on:
  push:
    branches: [codex/lesson-intro-runtime-check]
    paths: ['.github/workflows/summit-intro-fastlane.yml']
permissions:
  contents: write
concurrency:
  group: summit-intro-publish-s138-s145
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: '535f6ec4dceb26a49cbed4bfbe5f66e2dcbd0411'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install playback verification
        run: npm install --no-save playwright
      - name: Publish already-rendered films only after public playback verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python production/lesson-intros/course/release_intro.py publish S157 --wait-minutes 5
