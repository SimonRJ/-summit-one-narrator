name: Publish and verify completed Summit One introductions
run-name: Verify the next two Summit One lesson introductions
on:
  push:
    branches: [codex/lesson-intro-runtime-check]
    paths: ['.github/workflows/summit-intro-fastlane.yml']
permissions:
  contents: write
concurrency:
  group: summit-intro-ready-film-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install playback verification
        run: npm install --no-save playwright
      - name: Publish already-rendered films only after public playback verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python production/lesson-intros/course/release_intro.py publish S058 S086 --wait-minutes 5
