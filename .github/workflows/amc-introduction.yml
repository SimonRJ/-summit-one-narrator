name: Rebuild the reviewed AMC introduction
on:
  push:
    branches: [main, review/canonical-course-welcome-20261125]
    paths:
      - 'production/amc-introduction/**'
      - 'production/standalone-review/welcome_captions.py'
      - 'production/standalone-review/publish_guides.py'
      - '.github/workflows/amc-introduction.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amc-welcome-rebuild-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /production/amc-introduction
            /production/standalone-review
            /media/voice-audition
            /media/AMCIntroduction*
            /review/AMCIntroduction*
            /tools/welcome-check.mjs
            /welcome.html
            /welcome.js
            /welcome.css
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover the edition and its approved studio recordings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(python -c 'import json;print(json.load(open("production/amc-introduction/approved-master.json"))["release"])')
          if [[ "$GITHUB_REF_NAME" == main ]] || gh release view "$tag" > /dev/null 2>&1; then
            gh release download "$tag" --dir build/approved -p 'welcome-studio.zip' -p 'AMCIntroduction.mp4' -p 'AMCIntroduction.vtt' -p 'AMCIntroduction-transcript.txt' -p 'AMCIntroduction-qa.json'
          else
            # Rehearse the production rebuild while the candidate's device checks are in the queue.
            run=$(python -c 'import json;print(json.load(open("production/amc-introduction/approved-master.json"))["production_workflow_run"])')
            head=$(python -c 'import json;print(json.load(open("production/amc-introduction/approved-master.json"))["production_commit"])')
            test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$run --jq .head_sha)" = "$head"
            gh run download "$run" -n reviewed-standalone-masters -D build/studio
            gh run download "$run" -n reviewed-standalone-players -D build/player
            mkdir -p build/approved
            (cd build/studio && zip -q -r ../approved/welcome-studio.zip .)
            cp build/player/media/AMCIntroduction{.mp4,.vtt,-transcript.txt} build/player/review/AMCIntroduction-qa.json build/approved/
          fi
      - name: Rebuild the diagrams, captions and movie from the recorded performances
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core libsndfile1
          python -m pip install pillow numpy soundfile
          python production/amc-introduction/rebuild.py build/approved
      - uses: actions/upload-artifact@v4
        with:
          name: verified-course-welcome-rebuild
          path: |
            build/amc-introduction/rebuild-qa.json
            build/amc-introduction/contact.jpg
          if-no-files-found: error
          retention-days: 30
      - name: Restore the approved normal-entry-point assets
        if: github.ref_name == 'main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/AMCIntroduction* review/AMCIntroduction*.json welcome.html welcome.js tools/welcome-check.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Restore the reproduced course welcome and its measured guides'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
