name: Render the changing-length algebra bars in T02.3
on:
  push:
    branches: [codex/reviewed-film-work-20261119]
    paths: ['.github/workflows/stage-operation-order-20261119.yml']
permissions:
  contents: write
jobs:
  diagrams:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-open-sans fonts-dejavu-core
          pip install pillow numpy
      - name: Render the two changed scenes over the original captioned film
        run: python production/t01-studio/render_order_bars.py media/T02.3.mp4 build/bars
      - name: Preserve the reviewed movie and corresponding digest on a separate branch
        run: |
          cp build/bars/* media/
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('review/T02.3-studio-qa.json')
          report=json.loads(p.read_text())
          report['source_sha256']=report['sha256']
          report['sha256']=hashlib.sha256(pathlib.Path('media/T02.3.mp4').read_bytes()).hexdigest()
          report['diagram_revision']='Shared unit scale in scenes 4 and 5, original AAC packets and caption track retained'
          p.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add media/T02.3.mp4 media/T02.3-studio-poster.jpg review/T02.3-studio-qa.json
          git commit -m 'Stage the two corrected T02.3 bar-model scenes'
          git push origin HEAD:refs/heads/codex/t023-rendered-media-20261119
