name: T01.2 speech-synced smooth caption emphasis

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/t012-george-preview.yml"
      - "postproduction/karaoke_captions.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install media and alignment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install faster-whisper

      - name: Extract the exact finished George audio for alignment
        shell: bash
        run: |
          set -euo pipefail
          test -f media/T01.2_George_0.88.mp4
          ffmpeg -y \
            -i media/T01.2_George_0.88.mp4 \
            -vn -ac 1 -ar 16000 -c:a pcm_s16le \
            T01.2-george-align.wav

      - name: Generate speech-timestamped smooth letter-emphasis captions
        env:
          HF_HOME: ${{ runner.temp }}/hf-cache
        run: |
          mkdir -p postproduction/generated
          python postproduction/karaoke_captions.py \
            --audio T01.2-george-align.wav \
            --transcript-json data/teaching-72.json \
            --video-id T01.2 \
            --model base.en \
            --ass-out postproduction/generated/T01.2_George_0.88.ass \
            --qa-out postproduction/generated/T01.2_caption_alignment.json

      - name: Rebuild T01.2 with the new caption motion
        shell: bash
        run: |
          set -euo pipefail
          test -f review/T01.2.mp4
          test -f media/T01.2_George_0.88.mp4
          test -f postproduction/generated/T01.2_George_0.88.ass

          VIDEO_DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 review/T01.2.mp4)
          AUDIO_DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 media/T01.2_George_0.88.mp4)
          FACTOR=$(python3 - <<PY
          v=float("$VIDEO_DUR")
          a=float("$AUDIO_DUR")
          print(a/v)
          PY
          )

          echo "visual duration: $VIDEO_DUR"
          echo "George duration: $AUDIO_DUR"
          echo "visual timing scale factor: $FACTOR"

          ffmpeg -y \
            -i review/T01.2.mp4 \
            -i media/T01.2_George_0.88.mp4 \
            -filter_complex "[0:v]setpts=PTS*$FACTOR,drawbox=x=0:y=200:w=iw:h=70:color=0x071525:t=fill,subtitles=postproduction/generated/T01.2_George_0.88.ass:fontsdir=/usr/share/fonts/truetype/dejavu[v]" \
            -map "[v]" \
            -map 1:a:0 \
            -c:v libx264 \
            -preset medium \
            -crf 18 \
            -pix_fmt yuv420p \
            -c:a copy \
            -movflags +faststart \
            -shortest \
            T01.2_George_0.88_new.mp4

          mv T01.2_George_0.88_new.mp4 media/T01.2_George_0.88.mp4

          ffprobe -v error \
            -show_entries stream=index,codec_name,codec_type,width,height,sample_rate,channels \
            -show_entries format=duration,size \
            -of json media/T01.2_George_0.88.mp4

          cat postproduction/generated/T01.2_caption_alignment.json

      - name: Commit the revised captioned video and timing QA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            media/T01.2_George_0.88.mp4 \
            postproduction/generated/T01.2_George_0.88.ass \
            postproduction/generated/T01.2_caption_alignment.json
          if git diff --cached --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "Smooth T01.2 caption bolding to George speech"
          git push

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: T01.2-smooth-speech-synced-captions
          path: |
            media/T01.2_George_0.88.mp4
            postproduction/generated/T01.2_George_0.88.ass
            postproduction/generated/T01.2_caption_alignment.json
          retention-days: 7
          compression-level: 0
