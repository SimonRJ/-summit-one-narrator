name: Check the four T01 teaching films on phones
on:
  push:
    branches: [codex/reviewed-film-work-20261119]
    paths: ['.github/workflows/check-t01-teaching-players.yml']
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENGINE: chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - run: node tools/review-public-video-players.cjs T01.1 T01.2 T01.3 T01.E
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t01-review-chrome
          path: build/phone
          if-no-files-found: warn
  webkit:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    timeout-minutes: 15
    env:
      ENGINE: webkit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - run: node tools/review-public-video-players.cjs T01.1 T01.2 T01.3 T01.E
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t01-review-webkit
          path: build/phone
          if-no-files-found: warn
