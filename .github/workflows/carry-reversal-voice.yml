name: Record The carry counter and The reversal line
on:
  push:
    branches: [production/carry-and-reversal]
    paths: ['production/scripts/S009.json', 'production/scripts/S010.json', '.github/workflows/carry-reversal-voice.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carry-reversal-voice
  cancel-in-progress: false
jobs:
  voice:
    strategy:
      fail-fast: false
      matrix:
        film: [S009, S010]
        scene: [1,2,3,4,5,6]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            production
            data
            media/voice-audition
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the established narrator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.45,<5' 'huggingface-hub<1' einops pydantic soundfile librosa safetensors tqdm numpy scipy inflect addict argbind
          pip install --no-deps 'git+https://github.com/OpenBMB/VoxCPM.git@300e4260b509066151d623dc9c0aa922cf82232b'
      - name: Record a scene with its approved voice
        env:
          FILM: ${{ matrix.film }}
          SCENE: ${{ matrix.scene }}
        run: |
          python -c 'import json,os;json.dump([{"lesson":os.environ["FILM"],"scene":int(os.environ["SCENE"])}],open("sequence.json","w"))'
          python production/t01-studio/synth.py --sequence sequence.json --threads 4
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.film }}-fresh-voice-${{ matrix.scene }}
          path: build/t01-studio/${{ matrix.film }}-*
          if-no-files-found: error
          retention-days: 14
