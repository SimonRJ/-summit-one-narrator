name: Summit One release QA
# qa-figures
# rerun-generalized-exams

on:
  pull_request:
    branches: [main]
    paths: ['*.js', '*.html', '*.css', 'data/**', 'tools/**', '.github/workflows/release-qa.yml']
  workflow_dispatch:
  push:
    branches: [recognition-coverage-20261113, main, rebuild-exam-centres-20261112, draft/teaching-audit-2026-11-11]
    paths:
      - "*.js"
      - "*.html"
      - "*.css"
      - "data/**"
      - ".github/workflows/release-qa.yml"
      - "postproduction/**"
      - "tools/**"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check app-main.js
          node --check lesson-pager.js
          node --check lesson-screenflow.js
          node --check tests.js
          node --check lesson-player.js
          node --check problem-figures.js
          node --check welcome.js
          node --check login.js
          node --check supabase-client.js
          node --check sw.js
      - name: Canonical data invariants
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const sessions=JSON.parse(fs.readFileSync("data/sessions-372.json","utf8"));
          const teach=JSON.parse(fs.readFileSync("data/teaching-72.json","utf8"));
          const mawa=JSON.parse(fs.readFileSync("data/mawa-investigations-20.json","utf8"));
          const ross=JSON.parse(fs.readFileSync("data/rossmoyne-h23.json","utf8"));
          const awards=JSON.parse(fs.readFileSync("data/amc-awards.json","utf8"));
          const fail=m=>{throw new Error(m)};
          if(sessions.sessions.length!==372)fail("Expected 372 sessions");
          const slots=sessions.sessions.map(x=>x.slot);
          if(new Set(slots).size!==372||slots[0]!==1||slots.at(-1)!==372)fail("Session IDs invalid");
          const count=t=>sessions.sessions.filter(x=>x.type===t).length;
          if(count("LESSON")!==283||count("MAWA")!==53||count("MIXED")!==36)fail("Session type counts invalid");
          const expectedMawa=Array.from({length:53},(_,i)=>(i+1)*7);
          const gotMawa=sessions.sessions.filter(x=>x.type==="MAWA").map(x=>x.slot);
          if(JSON.stringify(expectedMawa)!==JSON.stringify(gotMawa))fail("MAWA cadence invalid");
          if(teach.items.length!==72)fail("Teaching count invalid");
          if(new Set(teach.items.map(x=>x.id)).size!==72)fail("Duplicate teaching IDs");
          if(mawa.items.length!==20)fail("MAWA source bank count invalid");
          if(ross.items.length!==23)fail("Rossmoyne H-map invalid");
          if(!awards.practice_estimate_wa?.year5||!awards.official)fail("Award config invalid");
          const thresholds=Array.from({length:20},(_,i)=>Math.ceil(372*(i+1)/20));
          if(thresholds[0]!==19||thresholds.at(-1)!==372)fail("Rank thresholds invalid");
          console.log("Canonical invariants passed.");
          NODE
      - name: Learning behaviour checks
        run: |
          node tools/check_learning.mjs
          node tools/check_fixed_lesson.mjs
      - name: Recognition and coverage checks
        run: node tools/check_recognition.mjs
      - name: New practice checks
        run: node tools/check_practice.mjs
      - name: Public-content safety
        run: |
          test ! -f data/challenges-amc-001-040.json
          test ! -f data/challenges-amc-041-080.json
          test ! -f data/challenges-amc-081-120.json
          test ! -f data/challenges-amc-121-152.json
          ! grep -R --line-number -E '"answer"[[:space:]]*:' data/sessions-372.json data/teaching-72.json || exit 1
          echo "No authenticated AMC answer bank on current Pages branch."
      - name: Video and media safety invariants
        run: |
          grep -q 'let attemptedProblemIds=new Set()' app-main.js
          grep -Fq 'Only concept/worked-example T videos are public. Every challenge solution is attempt-gated.' app-main.js
          grep -q 'independent_credit:false' app-main.js
          grep -Fq 'd.video_url||finalVideoUrl(p.id)' app-main.js
          grep -q 'completed_80_percent:true' lesson-player.js
          grep -q 'finished_video' lesson-player.js
          grep -q 'kokoro_fallback' lesson-player.js
          ! grep -R --line-number 'summit-one-audio-v1' app-main.js data/teaching-72.json || exit 1
          ! grep -R --line-number -E 'releases/download/[^ ]*/(A[0-9]{3}|K[0-9]{3}|N[1-4]\\.(26|27|28|29|30))\\.mp4' . --exclude-dir=.git || exit 1
          echo "Attempt gate, protected AMC media and viewed-only video evidence invariants passed."
      - name: Post-production tooling
        run: |
          python -m py_compile postproduction/finish_video.py postproduction/batch_finish.py postproduction/prepare_media_release.py postproduction/make_protected_delivery.py
          node --check postproduction/upload_protected_media.mjs
          grep -q 'public_contains_challenge' postproduction/prepare_media_release.py
          grep -q 'PROTECTED_VIDEO_BUCKET' postproduction/upload_protected_media.mjs
          echo "Post-production tooling syntax and media split checks passed."

      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Desktop and mobile workflows
        run: |
          python tools/papers/build_all.py /tmp/summit-papers
          node tools/browser_check.mjs
          node tools/welcome-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: summit-exam-centres-browser-review
          path: qa-screenshots/
