name: Live S008 opening on study screens
on:
  push:
    branches: [qa/s008-opening-20261124]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [iphone-portrait, ipad-portrait, ipad-landscape, pc]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools
            figures
            data
            vendor
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.58.0
      - if: matrix.profile != 'pc'
        run: python -m playwright install --with-deps webkit
      - env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python tools/check_s008_opening.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opening-${{ matrix.profile }}
          path: build/opening/
