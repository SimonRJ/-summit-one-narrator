name: Publish reviewed lesson 12 introduction

on:
  push:
    branches: [codex/s012-visual-rebuild-20261116]
    paths: ['.github/workflows/publish-reviewed-s012.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-lesson-12:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install Pillow
      - name: Independently check the lesson mathematics
        run: python production/lesson-intros/illustrated/check_s012.py
      - name: Re-render the reviewed storyboard with its original Voice C audio
        run: |
          python production/lesson-intros/illustrated/render.py S012 --out build/reviewed-s012 --preview
          python production/lesson-intros/illustrated/render.py S012 --out build/reviewed-s012
      - name: Upload and verify the replacement at the existing lesson link
        env:
          GH_TOKEN: ${{ github.token }}
        run: python production/lesson-intros/illustrated/publish.py S012 --out build/reviewed-s012
      - name: Preserve the actual published film and review frames
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-s012-film
          path: |
            build/reviewed-s012/S012-Intro-Illustrated.mp4
            build/reviewed-s012/S012-Intro-Illustrated-poster.jpg
            build/reviewed-s012/S012-contact.jpg
            build/reviewed-s012/S012-qa.json
          retention-days: 30
