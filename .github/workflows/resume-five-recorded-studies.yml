name: Resume the pinned lesson render jobs after recording
on:
  push:
    branches: [main, production/park-stalled-voice-waits]
    paths:
      - .github/workflows/resume-five-recorded-studies.yml
      - tools/video/reconcile_split_recordings.py
      - tools/video/split-recording-runs.json
  workflow_run:
    types: [completed]
    workflows:
      - Record the ribbon cutting table and the four signal flags
      - Record the print shop, bird hide and pottery kiln lessons
      - Record the mail train and the two-tile frame
      - Correct the two spoken conditions
      - Record the ferry-road ride and the starting whistles
      - Record the observatory and mosaic films
      - Record the rooftop ledger and cube scanner
      - Record the sorting drawers transfer
      - Record the price ticket, pump shed and claims noticeboard
      - Record the edging tape, museum ticket and climbing hall
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: resume-five-recorded-studies
  cancel-in-progress: false
jobs:
  reconcile:
    if: github.repository == 'SimonRJ/-summit-one-narrator'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: tools/video
      - name: Check the exact voice, render and live job step
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/video/reconcile_split_recordings.py
