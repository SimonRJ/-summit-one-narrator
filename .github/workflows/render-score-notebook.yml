name: Render the odd and even median film
on:
  push:
    branches: [production/median-score-notebook]
    paths: ['.github/workflows/render-score-notebook.yml', 'production/lesson-films/install_score_notebook.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /production/
            /data/
            /media/T16.3.mp4
            /media/T16.3.vtt
            /review/T16.3-studio-qa.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the film renderer and speech recognizer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core libsndfile1
          pip install pillow numpy soundfile num2words faster-whisper
      - name: Collect the two recordings and approved-reference receipts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RECORDING_RUN: '45487127337'
        run: |
          # Check the producing repository, branch and commit before using either asset.
          test "$(gh api "repos/$REPO/actions/runs/$RECORDING_RUN" --jq '.head_sha')" = 1fa6127c64440421c17e8a5797e9b93d42b665c5
          for attempt in $(seq 1 65); do
            state=$(gh api "repos/$REPO/actions/runs/$RECORDING_RUN" --jq '.status')
            if test "$state" = completed; then break; fi
            sleep 30
          done
          test "$(gh api "repos/$REPO/actions/runs/$RECORDING_RUN" --jq '.conclusion')" = success
          mkdir -p corrected
          for scene in 7 8; do
            gh run download "$RECORDING_RUN" -R "$REPO" -n "median-voice-$scene" -D "scene-$scene"
            key=T16.3-four-values; if test "$scene" = 8; then key=T16.3-median-recap; fi
            for ext in wav json; do cp "$(find "scene-$scene" -name "T16.3-0$scene.$ext" -print -quit)" "corrected/$key.$ext"; done
          done
      - name: Align the approved recording, render and inspect the encoded streams
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          python production/lesson-films/restore_teaching_speech.py T16.3 media review/T16.3-studio-qa.json corrected production/lesson-films/voice-c-repairs/requests.json small.en rendered
          python production/lesson-films/install_score_notebook.py rendered corrected package
          cp rendered/measured.json package/review/T16.3-score-notebook-measurements.json
      - uses: actions/upload-artifact@v4
        with:
          name: score-notebook-edition
          path: package/
          if-no-files-found: error
          retention-days: 30
