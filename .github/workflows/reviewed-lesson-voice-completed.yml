name: Stage the individually illustrated lessons after voice verification
on:
  workflow_run:
    workflows:
      - Recover the bead, scale and two-tray lesson in Voice C
      - Recover the original forced-domino lesson in Voice C
      - Record the two corrected coordinate questions for S083
      - Record the individually explained shopping comparisons for S041
    types: [completed]
    branches: [codex/reviewed-film-work-20261119]
permissions:
  contents: read
jobs:
  stage:
    if: github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.id == 44394377747 || github.event.workflow_run.id == 44394193825 || github.event.workflow_run.id == 44398986127 || github.event.workflow_run.id == 44399717895)
    runs-on: ubuntu-latest
    timeout-minutes: 34
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      VOICE_RUN: ${{ github.event.workflow_run.id }}
      FILM: ${{ github.event.workflow_run.id == 44394377747 && 'S024' || github.event.workflow_run.id == 44398986127 && 'S083' || github.event.workflow_run.id == 44399717895 && 'S041' || 'S036' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.id == 44398986127 && '69ee2e611707a1739b4ccf89adb87487f77653fe' || github.event.workflow_run.id == 44399717895 && '7edcc32558b999c5816231007ab6823b2e3fc113' || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load the measured recording for this lesson
        run: gh run download "$VOICE_RUN" --repo "$GITHUB_REPOSITORY" -n "${FILM,,}-checked-voice-and-timing" -D build/review-voice
      - name: Install drawing and encoding tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            opts=(-o Acquire::ForceIPv4=true -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
            sudo apt-get "${opts[@]}" update -qq
            sudo apt-get "${opts[@]}" install --no-install-recommends -y ffmpeg fonts-dejavu-core
          fi
          pip install pillow numpy
      - name: Render each scene at its measured spoken cues
        run: python production/lesson-intros/illustrated/render_voiced_board.py "$FILM" --audio build/review-voice --out build/finished-film
      - name: Stage matching media and verify the downloaded bytes
        run: |
          mkdir -p build/returned
          for asset in "$FILM-Intro-Illustrated.mp4" "$FILM-Intro-Illustrated-poster.jpg"; do
            if ! gh release download lesson-introductions -p "$asset" -D build/returned; then
              gh release upload lesson-introductions "build/finished-film/$asset"
              gh release download lesson-introductions -p "$asset" -D build/returned
            fi
            cmp "build/finished-film/$asset" "build/returned/$asset"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-public-render-${{ env.FILM }}
          path: build/finished-film/*-qa.json
          if-no-files-found: error
