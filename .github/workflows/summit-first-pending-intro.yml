name: Resume the individual lesson playback checks
on:
  push:
    branches: [codex/lesson-intro-runtime-check]
    paths: ['.github/workflows/summit-first-pending-intro.yml']

permissions:
  actions: read
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    concurrency:
      group: summit-one-lesson-intro-player-check
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - name: Confirm each staged introduction on the public site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python production/lesson-intros/course/release_intro.py publish \
            S010 S011 S012 S013 S015 S017 S018 S019 S020 S022 S023 S024 S025 S026 S027 S029 S030 \
            --wait-minutes 155
