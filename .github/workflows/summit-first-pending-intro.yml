name: Align and release the recorded cryptarithm introduction
on:
  push:
    branches: [codex/lesson-intro-runtime-check]
    paths: ['.github/workflows/summit-first-pending-intro.yml']

permissions:
  actions: read
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: S010-voice-*
          merge-multiple: true
          path: build/t01-studio
          run-id: 43776803536
          github-token: ${{ github.token }}
      - name: Align the original audio and render the introduction
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-open-sans fonts-dejavu-core libsndfile1
          pip install pillow numpy soundfile num2words faster-whisper
          python production/lesson-intros/course/compile_intros.py S010
          python production/t01-studio/prepare_audio.py S010
          python production/t01-studio/render.py S010 --preview
          python production/t01-studio/render.py S010
      - name: Stage the cryptarithm film for the live playback check
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: production/lesson-intros/course
        run: |
          python - <<'PY'
          from release_intro import current_candidate, stage
          if not current_candidate("S010"):
              stage("S010")
          PY
