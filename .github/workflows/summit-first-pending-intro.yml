name: Prepare the next Summit One lesson introductions
run-name: Render the corrected Lesson 137 introduction

on:
  push:
    branches: [codex/lesson-intro-runtime-check]
    paths: ['.github/workflows/summit-first-pending-intro.yml']

concurrency:
  group: summit-one-lesson-intro-corrected-s137
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 280
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        lesson: [S137]
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: '39a1e30dd3e6ebab43398acbade68bf2cca134ad'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Identify identical reusable teaching passages
        id: voice
        env:
          LESSON: ${{ matrix.lesson }}
        run: |
          key=$(python production/lesson-intros/course/produce_lesson.py "$LESSON" --cache-key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Reuse verified Voice C audio for identical passages
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: build/t01-studio/shared-voice
          key: summit-intro-voice-c-${{ steps.voice.outputs.key }}
      - name: Install the pinned Voice C and video runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libsndfile1 fonts-open-sans fonts-dejavu-core
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.45,<5' 'huggingface-hub<1' einops pydantic soundfile librosa safetensors tqdm numpy scipy inflect addict argbind pillow num2words faster-whisper
          pip install --no-deps 'git+https://github.com/OpenBMB/VoxCPM.git@300e4260b509066151d623dc9c0aa922cf82232b'
      - name: Record, align and render the lesson introduction
        env:
          LESSON: ${{ matrix.lesson }}
        run: python production/lesson-intros/course/produce_lesson.py "$LESSON" --attempt 0
      - name: Wait for the earlier Lesson 137 render before replacing its staged files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          until [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/133180080925" --jq .status)" = completed ]; do
            sleep 25
          done
      - name: Upload this checked movie
        env:
          GH_TOKEN: ${{ github.token }}
          LESSON: ${{ matrix.lesson }}
          PYTHONPATH: production/lesson-intros/course
        run: |
          python - <<'PY'
          from release_intro import current_candidate, stage
          if not current_candidate('S137'):
              stage('S137')
          PY
      - name: Save diagnostics if a film needs another take
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.lesson }}
          path: |
            build/t01-studio/${{ matrix.lesson }}/alignment-failure.json
            build/t01-studio/${{ matrix.lesson }}/storyboard/*.jpg
          if-no-files-found: ignore
          retention-days: 3
      - name: Retain complete scenes for a retry
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: recordings-${{ matrix.lesson }}
          path: |
            build/t01-studio/${{ matrix.lesson }}-*.wav
            build/t01-studio/${{ matrix.lesson }}-*.json
          compression-level: 1
          if-no-files-found: ignore
          retention-days: 1


