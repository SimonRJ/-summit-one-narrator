name: Generate Summit One narration

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate-narration.yml"

permissions:
  contents: read

jobs:
  narrate:
    name: Narration shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ["01","02","03","04","05","06","07","08","09","10"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Kokoro
        run: |
          npm init -y
          npm install kokoro-js@1.2.1

      - name: Generate WAV narration
        run: |
          node scripts/generate-narration.mjs "queue-${{ matrix.shard }}.json" "out-${{ matrix.shard }}"

      - name: Upload narration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summit-one-narration-${{ matrix.shard }}
          path: out-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
