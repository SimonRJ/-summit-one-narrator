name: Recorded lesson playback
on:
  push:
    branches: [main]
    paths: ['data/recorded-studies.json', 'lesson-introduction-media.js', 'lesson-introduction-library.js', 'tools/check_recorded_studies.py', 'tools/check_public_catalogue.py', 'watch-lesson-intro.html', 'watch-intro-s*.html', 'lesson-introduction-videos.html', '.github/workflows/recorded-study-playback.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.58.0
      - if: matrix.engine == 'webkit'
        run: python -m playwright install --with-deps webkit
      - name: Check published, pending and unavailable lesson routes
        run: python tools/check_public_catalogue.py --engine "${{ matrix.engine }}"
      - name: Play and seek every published study at phone width
        env:
          ENGINE: ${{ matrix.engine }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            python tools/check_recorded_studies.py --engine "$ENGINE" --site 'https://simonrj.github.io/-summit-one-narrator/'
          else
            python -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/course.log" 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid"' EXIT
            python tools/check_recorded_studies.py --engine "$ENGINE"
          fi
