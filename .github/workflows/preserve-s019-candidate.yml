name: Preserve the distinct lesson 19 candidate for review
on:
  push:
    branches: [codex/s019-distinct-20261116]
    paths: ['.github/workflows/preserve-s019-candidate.yml']
permissions:
  contents: write
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core zip
          pip install pillow
      - name: Retrieve the aligned approved-voice recording
        run: gh run download 43865263035 --repo "$GITHUB_REPOSITORY" --name s019-final-audio-and-timeline --dir build/s019-audio
      - name: Check the board mathematics and render a review candidate
        run: |
          python production/lesson-intros/illustrated/check_s019.py
          python production/lesson-intros/illustrated/render_s019_distinct.py --audio build/s019-audio --out build/s019-candidate
      - name: Preserve the candidate and source without changing the live catalogue
        run: |
          cp build/s019-candidate/S019-Intro-Illustrated.mp4 build/s019-candidate/S019-Intro-Preview-20261116-v2.mp4
          cp build/s019-candidate/S019-Intro-Illustrated-poster.jpg build/s019-candidate/S019-Intro-Preview-20261116-v2-poster.jpg
          cd build/s019-audio
          zip -1 ../s019-candidate/S019-distinct-audio-timeline-20261116-v2.zip narration.wav timeline.json captions.vtt
          cd ../..
          mkdir -p build/s019-download-check
          for name in S019-Intro-Preview-20261116-v2.mp4 S019-Intro-Preview-20261116-v2-poster.jpg S019-distinct-audio-timeline-20261116-v2.zip; do
            if ! gh release view lesson-introductions --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              gh release upload lesson-introductions "build/s019-candidate/$name" --repo "$GITHUB_REPOSITORY"
            fi
            gh release download lesson-introductions --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir build/s019-download-check
            cmp "build/s019-candidate/$name" "build/s019-download-check/$name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: s019-distinct-review-candidate
          path: build/s019-candidate/
          if-no-files-found: error
          retention-days: 14
