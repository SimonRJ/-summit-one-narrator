name: Redraw a verified published study
on:
  workflow_call:
    inputs:
      lesson: {required: true, type: string}
      release_slug: {required: true, type: string}
      release_title: {required: true, type: string}
      release_notes: {required: true, type: string}
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            production
            data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Draw, encode and compare the master with its artwork and speech
        env:
          LESSON: ${{ inputs.lesson }}
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get install -y ffmpeg fonts-open-sans fonts-dejavu-core
          python -m pip install 'numpy==2.2.6' 'pillow==11.3.0' num2words soundfile faster-whisper
          python production/lesson-films/align_published_study.py "$LESSON" build/recording build/archived-source
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path('build/recording')
          script = json.loads((source / 'script.json').read_text())
          timeline = json.loads((source / 'timeline.json').read_text())
          narration = ' '.join(scene['narration'] for scene in script['scenes'])
          captions = ' '.join(cue['text'] for cue in timeline['captions'])
          assert narration == captions, 'Every spoken word must have its timed caption'
          PY
          python production/lesson-films/render_recorded.py "$LESSON" build/recording
          python production/lesson-films/verify_recorded.py "$LESSON" build/recording
          python production/lesson-films/render_recorded.py "$LESSON" build/recording --previews build/stills
          mkdir -p build/candidate
          cp "media/lesson-films/$LESSON.mp4" "media/lesson-films/$LESSON-poster.jpg" build/candidate/
          cp production/lesson-films/"$LESSON"/guide.json build/candidate/"$LESSON"-guide.json
          cp production/lesson-films/"$LESSON"/qa.json build/candidate/"$LESSON"-qa.json
          cp build/recording/captions.vtt build/candidate/"$LESSON".vtt
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZipInfo
          import os
          source = Path('build/recording')
          with ZipFile(Path('build/candidate') / (os.environ['LESSON']+'-recording.zip'), 'w') as archive:
              for name in ('script.json', 'timeline.json', 'captions.vtt', 'narration.flac'):
                  archive.writestr(ZipInfo(name), (source / name).read_bytes())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.lesson }}-reviewed-candidate
          path: build/candidate/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.lesson }}-review-stills
          path: build/stills/
          if-no-files-found: error
          retention-days: 30

  playback:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [iphone-portrait, iphone-landscape, ipad-portrait, ipad-landscape, pc]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            data
            tools
            figures
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.lesson }}-reviewed-candidate
          path: build/candidate
      - run: python -m pip install 'playwright==1.58.0' aiohttp
      - if: matrix.profile != 'pc'
        run: python -m playwright install --with-deps webkit
      - name: Exercise the candidate through the app, gallery and notebook
        env:
          LESSON: ${{ inputs.lesson }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          lesson_id=os.environ["LESSON"]
          from pathlib import Path
          guide = json.loads((Path('build/candidate')/(lesson_id+'-guide.json')).read_text())
          guide['release'] = 'http://127.0.0.1:8765/build/candidate/'
          catalogue = Path('data/recorded-studies.json')
          data = json.loads(catalogue.read_text())
          data['lessons'][lesson_id] = guide
          catalogue.write_text(json.dumps(data))
          slot = int(lesson_id[1:])
          candidates = [Path('data/read-watch-practise.json'), Path('data/read-watch-practise-later.json')]
          for source in candidates:
              data = json.loads(source.read_text())
              lesson = next((row for row in data['lessons'] if row['slot'] == slot), None)
              if lesson is not None:
                  break
          else:
              raise ValueError(f'Missing reading for slot {slot}')
          lesson.update(videoId=lesson_id, bridge=guide['bridge'], videoTitle=guide['title'], movie=guide['release'] + lesson_id+'.mp4', filmUse='dedicated')
          source.write_text(json.dumps(data))
          PY
          python - <<'PY' > "$RUNNER_TEMP/study-server.log" 2>&1 &
          from aiohttp import web
          from pathlib import Path
          root = Path.cwd()
          app = web.Application()
          async def index(request):
              return web.FileResponse(root / 'index.html')
          app.router.add_get('/', index)
          app.router.add_static('/', root)
          web.run_app(app, host='127.0.0.1', port=8765)
          PY
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --silent --retry 15 --retry-connrefused http://127.0.0.1:8765/ -o /dev/null
          python tools/check_lesson_film_routes.py --lesson "$LESSON" --site http://127.0.0.1:8765/ --profile "$PROFILE" --output build/device
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.lesson }}-candidate-${{ matrix.profile }}
          path: build/device/
          if-no-files-found: warn
          retention-days: 30

  release:
    needs: playback
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.lesson }}-reviewed-candidate
          path: verified
      - name: Publish the checked edition and compare every returned asset
        env:
          GH_TOKEN: ${{ github.token }}
          LESSON: ${{ inputs.lesson }}
          RELEASE_SLUG: ${{ inputs.release_slug }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${RELEASE_SLUG}-${GITHUB_SHA:0:12}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES"
          fi
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
          if [[ "$draft" == true ]]; then gh release upload "$tag" verified/* --clobber; fi
          gh release download "$tag" --dir returned
          for asset in verified/*; do cmp "$asset" "returned/${asset##*/}"; done
          if [[ "$draft" == true ]]; then gh release edit "$tag" --draft=false --latest=false; fi
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = false
          echo "Released $tag"
          cat verified/"$LESSON"-guide.json
          cat verified/"$LESSON"-qa.json
