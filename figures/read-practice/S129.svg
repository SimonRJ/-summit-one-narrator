<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 115" role="img"><title>At the start, the trailing runner is twelve metres behind. Both run in the same direction, with speeds seven and five metres per second.</title><rect width="310" height="115" rx="8" fill="#faf7ed"/><line x1="40" y1="49" x2="116" y2="49" stroke="#236756" stroke-width="3" stroke-dasharray=""/><polygon points="116,49 107,44 107,54" fill="#236756" stroke="#236756" stroke-width="2"/><line x1="172" y1="49" x2="225" y2="49" stroke="#46809b" stroke-width="3" stroke-dasharray=""/><polygon points="225,49 216,44 216,54" fill="#46809b" stroke="#46809b" stroke-width="2"/><circle cx="40" cy="49" r="4" fill="#1e3441"/><circle cx="172" cy="49" r="4" fill="#1e3441"/><text x="80" y="34" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e3441" paint-order="stroke" stroke="#faf7ed" stroke-width="3" stroke-linejoin="round">7 m/s</text><text x="199" y="34" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e3441" paint-order="stroke" stroke="#faf7ed" stroke-width="3" stroke-linejoin="round">5 m/s</text><line x1="40" y1="75" x2="172" y2="75" stroke="#1e3441" stroke-width="2" stroke-dasharray=""/><line x1="40" y1="70" x2="40" y2="80" stroke="#1e3441" stroke-width="2" stroke-dasharray=""/><line x1="172" y1="70" x2="172" y2="80" stroke="#1e3441" stroke-width="2" stroke-dasharray=""/><text x="106" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3441" paint-order="stroke" stroke="#faf7ed" stroke-width="3" stroke-linejoin="round">12 m at the start</text></svg>
