<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 96" role="img"><title>Two equal route halves. The second half is six kilometres, travelled at twelve kilometres per hour.</title><rect width="290" height="96" rx="8" fill="#faf7ed"/><rect x="25" y="33" width="120" height="32" fill="#c5dce7" stroke="#1e3441" stroke-width="1"/><rect x="145" y="33" width="120" height="32" fill="#b5d9c7" stroke="#1e3441" stroke-width="1"/><text x="84" y="55" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e3441" paint-order="stroke" stroke="#faf7ed" stroke-width="3" stroke-linejoin="round">first half</text><text x="205" y="55" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e3441" paint-order="stroke" stroke="#faf7ed" stroke-width="3" stroke-linejoin="round">6 km</text><text x="205" y="86" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3441" paint-order="stroke" stroke="#faf7ed" stroke-width="3" stroke-linejoin="round">12 km/h</text></svg>
