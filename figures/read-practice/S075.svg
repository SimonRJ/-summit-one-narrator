<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 267 103" role="img"><title>The green group has two equal parts and the yellow group has three. The two green parts together stand for eight flags.</title><rect width="267" height="103" rx="8" fill="#faf7ed"/><text x="39" y="32" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3441" paint-order="stroke" stroke="#faf7ed" stroke-width="3" stroke-linejoin="round">Green</text><rect x="77" y="15" width="33" height="24" fill="#b5d9c7" stroke="#1e3441" stroke-width="1"/><rect x="110" y="15" width="33" height="24" fill="#b5d9c7" stroke="#1e3441" stroke-width="1"/><text x="39" y="77" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3441" paint-order="stroke" stroke="#faf7ed" stroke-width="3" stroke-linejoin="round">Yellow</text><rect x="77" y="60" width="33" height="24" fill="#eccc85" stroke="#1e3441" stroke-width="1"/><rect x="110" y="60" width="33" height="24" fill="#eccc85" stroke="#1e3441" stroke-width="1"/><rect x="143" y="60" width="33" height="24" fill="#eccc85" stroke="#1e3441" stroke-width="1"/><text x="175" y="32" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3441" paint-order="stroke" stroke="#faf7ed" stroke-width="3" stroke-linejoin="round">8 flags</text></svg>
