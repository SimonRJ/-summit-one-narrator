<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 174" role="img" aria-labelledby="title desc"><title id="title">A square is divided into two horizontal strips by one full line. How many grid-line rectangles are there?</title><desc id="desc">Three copies of a square split horizontally. The outlines select the top strip, the bottom strip and the whole square.</desc><rect width="100%" height="100%" rx="9" fill="#10232c"/>
<rect x="24" y="19" width="104" height="104" fill="#1b3440" stroke="#d8e9eb" stroke-width="2"/><path d="M24 71h104" stroke="#d8e9eb" stroke-width="2"/>
<rect x="24" y="19" width="104" height="52" fill="#79e9bf" fill-opacity=".15" stroke="#8af5ce" stroke-width="5"/>
<text x="76" y="153" fill="white" text-anchor="middle" font-family="sans-serif" font-size="16">Top strip</text>
<rect x="176" y="19" width="104" height="104" fill="#1b3440" stroke="#d8e9eb" stroke-width="2"/><path d="M176 71h104" stroke="#d8e9eb" stroke-width="2"/>
<rect x="176" y="71" width="104" height="52" fill="#79e9bf" fill-opacity=".15" stroke="#8af5ce" stroke-width="5"/>
<text x="228" y="153" fill="white" text-anchor="middle" font-family="sans-serif" font-size="16">Bottom strip</text>
<rect x="328" y="19" width="104" height="104" fill="#1b3440" stroke="#d8e9eb" stroke-width="2"/><path d="M328 71h104" stroke="#d8e9eb" stroke-width="2"/>
<rect x="328" y="19" width="104" height="104" fill="#79e9bf" fill-opacity=".15" stroke="#8af5ce" stroke-width="5"/>
<text x="380" y="153" fill="white" text-anchor="middle" font-family="sans-serif" font-size="16">Both strips</text>
</svg>
