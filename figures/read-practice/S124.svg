<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292 112" role="img"><title>The higher score is five equal parts and the lower is three. The two extra parts account for the difference of eight.</title><rect width="292" height="112" rx="8" fill="#faf7ed"/><text x="38" y="31" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3441" paint-order="stroke" stroke="#faf7ed" stroke-width="3" stroke-linejoin="round">Higher</text><rect x="76" y="14" width="33" height="24" fill="#b5d9c7" stroke="#1e3441" stroke-width="1"/><rect x="109" y="14" width="33" height="24" fill="#b5d9c7" stroke="#1e3441" stroke-width="1"/><rect x="142" y="14" width="33" height="24" fill="#b5d9c7" stroke="#1e3441" stroke-width="1"/><rect x="175" y="14" width="33" height="24" fill="#eccc85" stroke="#1e3441" stroke-width="1"/><rect x="208" y="14" width="33" height="24" fill="#eccc85" stroke="#1e3441" stroke-width="1"/><text x="38" y="74" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3441" paint-order="stroke" stroke="#faf7ed" stroke-width="3" stroke-linejoin="round">Lower</text><rect x="76" y="57" width="33" height="24" fill="#b5d9c7" stroke="#1e3441" stroke-width="1"/><rect x="109" y="57" width="33" height="24" fill="#b5d9c7" stroke="#1e3441" stroke-width="1"/><rect x="142" y="57" width="33" height="24" fill="#b5d9c7" stroke="#1e3441" stroke-width="1"/><line x1="176" y1="91" x2="239" y2="91" stroke="#a44219" stroke-width="2" stroke-dasharray=""/><text x="208" y="106" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1e3441" paint-order="stroke" stroke="#faf7ed" stroke-width="3" stroke-linejoin="round">gap = 8</text></svg>
