<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 174" role="img" aria-labelledby="title desc"><title id="title">How many squares fit along the lines of a 2-by-2 grid?</title><desc id="desc">Two copies of a two-by-two grid. The first numbers the four unit squares. The second outlines the single square made from all four.</desc><rect width="100%" height="100%" rx="9" fill="#10232c"/>
<rect x="24" y="19" width="104" height="104" fill="#1b3440" stroke="#d8e9eb" stroke-width="2"/><path d="M24 71h104" stroke="#d8e9eb" stroke-width="2"/>
<path d="M76 19v104" stroke="#d8e9eb" stroke-width="2"/>
<text x="50" y="53" text-anchor="middle" font-family="sans-serif" font-size="23" fill="white">1</text>
<text x="102" y="53" text-anchor="middle" font-family="sans-serif" font-size="23" fill="white">2</text>
<text x="50" y="105" text-anchor="middle" font-family="sans-serif" font-size="23" fill="white">3</text>
<text x="102" y="105" text-anchor="middle" font-family="sans-serif" font-size="23" fill="white">4</text>
<text x="76" y="153" fill="white" text-anchor="middle" font-family="sans-serif" font-size="16">Four unit squares</text>
<rect x="176" y="19" width="104" height="104" fill="#1b3440" stroke="#d8e9eb" stroke-width="2"/><path d="M176 71h104" stroke="#d8e9eb" stroke-width="2"/>
<path d="M228 19v104" stroke="#d8e9eb" stroke-width="2"/>
<rect x="176" y="19" width="104" height="104" fill="#79e9bf" fill-opacity=".15" stroke="#8af5ce" stroke-width="5"/>
<text x="228" y="153" fill="white" text-anchor="middle" font-family="sans-serif" font-size="16">One larger square</text>
</svg>
