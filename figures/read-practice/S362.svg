<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 110" role="img"><title>First weighing: bag plus bag plus tin equals seventeen kilograms. Second weighing: bag plus tin equals eleven kilograms.</title><rect width="310" height="110" rx="8" fill="#faf7ed"/><rect x="17" y="13" width="50" height="31" fill="#c5dce7" stroke="#1e3441" stroke-width="1"/><rect x="70" y="13" width="50" height="31" fill="#c5dce7" stroke="#1e3441" stroke-width="1"/><rect x="123" y="13" width="50" height="31" fill="#eccc85" stroke="#1e3441" stroke-width="1"/><text x="42" y="34" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e3441" paint-order="stroke" stroke="#faf7ed" stroke-width="3" stroke-linejoin="round">bag</text><text x="95" y="34" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e3441" paint-order="stroke" stroke="#faf7ed" stroke-width="3" stroke-linejoin="round">bag</text><text x="148" y="34" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e3441" paint-order="stroke" stroke="#faf7ed" stroke-width="3" stroke-linejoin="round">tin</text><text x="226" y="34" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e3441" paint-order="stroke" stroke="#faf7ed" stroke-width="3" stroke-linejoin="round">17 kg</text><rect x="70" y="65" width="50" height="31" fill="#c5dce7" stroke="#1e3441" stroke-width="1"/><rect x="123" y="65" width="50" height="31" fill="#eccc85" stroke="#1e3441" stroke-width="1"/><text x="95" y="85" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e3441" paint-order="stroke" stroke="#faf7ed" stroke-width="3" stroke-linejoin="round">bag</text><text x="148" y="85" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e3441" paint-order="stroke" stroke="#faf7ed" stroke-width="3" stroke-linejoin="round">tin</text><text x="226" y="85" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1e3441" paint-order="stroke" stroke="#faf7ed" stroke-width="3" stro