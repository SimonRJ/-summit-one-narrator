<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050a12"><title>Exam · Summit One</title><link rel="stylesheet" href="app.css">
<style>.exam-shell{width:min(1180px,calc(100% - 24px));margin:auto;padding:18px 0 60px}.exam-head{position:sticky;top:0;z-index:10;background:#050a12ee;border-bottom:1px solid #20364d;padding:12px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}.timer{font-variant-numeric:tabular-nums;font-size:1.35rem;font-weight:950;color:#ffd166}.qnav{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:14px 0}.qnav button{padding:9px 2px;background:#0b1724;border:1px solid #28445d}.qnav button.answered{background:#153b2c;border-color:#3c7458}.qnav button.current{outline:2px solid #70dcff}.question{min-height:360px}.choice{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:1px solid #2a4964;background:#091724;border-radius:13px}.choice.selected{border-color:#70dcff;background:#12334a}.unsaved{color:#ffd166}.saved{color:#7ce0a3}@media(max-width:700px){.qnav{grid-template-columns:repeat(6,1fr)}}</style></head><body>
<div class="exam-shell" id="examApp"><div class="card">Preparing assessment…</div></div><script type="module" src="exam.js?v=1"></script></body></html>
