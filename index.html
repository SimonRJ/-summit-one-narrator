<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111e">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Summit One · Learning</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="main.css?v=focus-20261113">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Summit One home"><span class="brand-mark">△</span><span><b>SUMMIT ONE</b><small>MATHEMATICS TRAINING</small></span></a>
    <nav class="topnav" aria-label="Main navigation">
      <button data-view="home" class="nav-btn active nav-major" type="button">Learn</button>
      <a href="tests.html" class="nav-link nav-major">Exams</a>
      <button data-view="profile" class="nav-btn nav-major nav-stats" type="button" aria-label="View progress and profile"><span>Progress</span><span id="navProgress" class="nav-progress-value" aria-hidden="true">— / 372</span></button>
      <details id="navMore" class="nav-more">
        <summary aria-label="More navigation options">More <span aria-hidden="true">⌄</span></summary>
        <div class="nav-more-panel">
          <button data-view="review" class="nav-btn" type="button">Completed sessions</button>
          <button data-view="repairs" class="nav-btn" type="button">Repairs & revision</button>
          <button data-view="roadmap" class="nav-btn" type="button">Goals & readiness</button>
          <a class="nav-link" href="welcome.html?from=dashboard">AMC introduction</a>
        </div>
      </details>
    </nav>
  </header>
  <main id="app" class="shell" aria-live="polite">
    <section id="loading" class="panel hero-panel"><div class="eyebrow">LOADING YOUR LEARNING PATH</div><h1>Preparing Summit One…</h1><p class="muted">Loading your secure progress and the 372-session course.</p></section>
  </main>
  <template id="problemTemplate">
    <article class="problem-card"><div class="problem-meta"></div><h3 class="problem-title"></h3><div class="problem-prompt math-copy"></div>
      <label class="answer-label">Final answer only<textarea class="answer-box" rows="2" placeholder="Enter one final number, fraction or requested answer."></textarea></label>
      <label class="answer-label">Working and explanation<textarea class="answer-box working-box" rows="5" placeholder="Explain your method here, or note that your full working is in your notebook."></textarea></label>
      <div class="problem-actions"><button class="primary submit-answer">Record attempt</button><button class="ghost reveal-solution" hidden>Compare with solution</button></div>
      <div class="attempt-feedback" hidden></div><div class="solution-panel" hidden></div>
    </article>
  </template>
  <script type="module" src="app-main.js?v=focus-20261113"></script>
</body>
</html>
