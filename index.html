<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111e">
  <link rel="stylesheet" href="boot-loader.css?v=cinematic-20261113">
  <script defer src="boot-loader.js?v=identity-math-20261113"></script>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Summit One · Learning</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="main.css?v=data-audit-20261114">

  <!-- Summit One editorial identity and genuine TeX mathematics -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.css">
  <link rel="stylesheet" href="design-system.css?v=advanced-20261113">
  <script async src="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.js" onload="window.dispatchEvent(new Event('summit:math-ready'))"></script>
  <script type="module" src="math-typography.js?v=advanced-20261113"></script>
</head>
<body>
  <div id="summitBoot" class="summit-boot" data-mode="main" role="status" aria-label="Summit One loading" aria-live="polite"><span class="sb-first-frame" aria-hidden="true"><img src="summit-mark.svg" alt="" width="104" height="104"></span></div>
  <div class="stars" aria-hidden="true"></div>
  <header class="topbar">
    <button id="menuToggle" class="menu-trigger" type="button" aria-controls="courseMenu" aria-haspopup="dialog" aria-expanded="false" aria-label="Open the main menu">
      <span class="menu-trigger-icon" aria-hidden="true">☰</span><span>Menu</span>
    </button>
    <a class="brand" href="./" aria-label="Summit One Learning home"><span class="brand-mark"><img src="summit-mark.svg" alt="" width="40" height="40"></span><span><b>SUMMIT <span class="summit-wordmark-one">ONE</span></b><small>MATHEMATICS TRAINING</small></span></a>
  </header>
  <dialog id="courseMenu" class="course-menu" aria-labelledby="courseMenuTitle">
    <div class="course-menu-shell">
      <header class="course-menu-head">
        <div class="course-menu-identity"><img src="summit-mark.svg" alt="" width="39" height="39"><div><div class="eyebrow">SUMMIT ONE</div><h2 id="courseMenuTitle">Menu</h2></div></div>
        <button id="menuClose" type="button" class="menu-close" aria-label="Close menu">✕</button>
      </header>
      <div id="courseMenuContent" class="course-menu-content" aria-live="polite"></div>
      <footer class="course-menu-footer">
        <button type="button" class="course-menu-progress" data-menu-action="profile">
          <span><b>Progress & profile</b><small>Your saved learning history</small></span>
          <strong id="navProgress">— / 372</strong>
        </button>
      </footer>
    </div>
  </dialog>
  <main id="app" class="shell" aria-live="polite">
    <section id="loading" class="panel hero-panel"><div class="eyebrow">LOADING YOUR LEARNING PATH</div><h1>Preparing Summit One…</h1><p class="muted">Loading your secure progress and the 372-session course.</p></section>
  </main>
  <template id="problemTemplate">
    <article class="problem-card"><div class="problem-meta"></div><h3 class="problem-title"></h3><div class="problem-prompt math-copy"></div>
      <label class="answer-label">Final answer<input class="answer-box final-answer-input" inputmode="text" autocomplete="off" placeholder="Enter your final answer"></label>
      <div class="problem-actions"><button class="primary submit-answer">Record attempt</button><button class="ghost reveal-solution" hidden>Compare with solution</button></div>
      <div class="attempt-feedback" hidden></div><div class="solution-panel" hidden></div>
    </article>
  </template>
  <script type="module" src="app-main.js?v=upper-primary-audit-20261114"></script>
</body>
</html>
